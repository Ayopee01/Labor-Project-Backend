apiVersion: 1

# Provisioning ผูก Loki เป็น datasource อัตโนมัติตอน Grafana start — ไม่ต้องตั้งเองผ่าน UI ทุกครั้งที่
# deploy ใหม่ ผู้ใช้แค่ login ด้วย GRAFANA_ADMIN_USER/PASSWORD จาก .env แล้วเปิด Explore เลือก Loki ได้ทันที
datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
