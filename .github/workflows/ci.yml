name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: labor_project_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d labor_project_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/labor_project_test
      REDIS_URL: redis://localhost:6379/15
      REDIS_WORKER_QUEUE_KEY: "ci:worker:queue"
      REDIS_WORKER_STATUS_KEY_PREFIX: "ci:worker:status:"
      REDIS_WORKER_PRESENCE_KEY_PREFIX: "ci:worker:presence:"
      REDIS_WORKER_BREAK_COUNT_KEY_PREFIX: "ci:worker:break-count:"
      REDIS_WORKER_BREAK_RETRY_KEY_PREFIX: "ci:worker:break-retry:"
      BULLMQ_ASSIGNMENT_TIMEOUT_QUEUE: ci-assignment-timeouts
      BULLMQ_WORKER_BREAK_RETURN_QUEUE: ci-worker-break-returns
      BULLMQ_LINE_MESSAGE_QUEUE: ci-line-messages
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret
      JWT_LOGIN_CHALLENGE_SECRET: ci-login-challenge-secret-ci-login
      REFRESH_TOKEN_HASH_SECRET: ci-refresh-hash-secret-ci-refresh-hash
      CORS_ORIGIN: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # unit และ route test mock module ผ่าน Module._load ซึ่งทำงานบน Node เท่านั้น
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Typecheck
        run: bun run typecheck

      - name: Unit and route tests
        run: bun run test

      - name: Deploy test migrations
        run: bun run db:deploy

      - name: Seed test system settings
        run: bun run db:seed:test-settings

      - name: Integration tests
        run: RUN_DB_TESTS=1 bun run test:integration

      - name: Concurrency tests
        run: RUN_DB_TESTS=1 bun run test:concurrency

      - name: End-to-end tests
        run: RUN_DB_TESTS=1 bun run test:e2e

      - name: Realtime tests
        run: RUN_DB_TESTS=1 bun run test:realtime
