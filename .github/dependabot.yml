version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "อัปเดต package"
    # รวม minor/patch เป็น PR เดียว ส่วน major แยก PR ตาม package
    groups:
      bun-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "อัปเดต action"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "อัปเดต docker image"
    # อัปเดตเฉพาะ minor/patch (security release) เมื่อ merge ต้องแก้เลข Bun ใน package.json และ ci.yml ให้ตรงกัน ส่วน major ต้องอัปเกรดเอง
    ignore:
      - dependency-name: "oven/bun"
        update-types: ["version-update:semver-major"]
