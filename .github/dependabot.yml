version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "อัปเดต package"
    # รวม minor/patch เป็น PR เดียว ส่วน major แยก PR ตาม package
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "อัปเดต action"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
