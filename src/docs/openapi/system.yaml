paths:
  /ready:
    get:
      tags:
        - System
      summary: ตรวจความพร้อมของ dependency
      description: ใช้ตรวจ readiness ของ backend และ dependency หลัก เช่น database เพื่อบอกว่า service พร้อมรับ traffic หรือยัง
      responses:
        "200":
          description: Service พร้อมรับ traffic (database และ redis เชื่อมต่อได้ทั้งคู่)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Service ยังไม่พร้อม (database หรือ redis เชื่อมต่อไม่ได้อย่างน้อย 1 อย่าง หรืออยู่ระหว่าง graceful shutdown)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /:
    get:
      tags:
        - System
      summary: ตรวจความพร้อมของ dependency (ค่าเดียวกับ /ready)
      description: Path หลักของ service ตอบผลเหมือน GET /ready ทุกประการ
      responses:
        "200":
          description: Service พร้อมรับ traffic (database และ redis เชื่อมต่อได้ทั้งคู่)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Service ยังไม่พร้อม (database หรือ redis เชื่อมต่อไม่ได้อย่างน้อย 1 อย่าง หรืออยู่ระหว่าง graceful shutdown)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /livez:
    get:
      tags:
        - System
      summary: ตรวจว่า process ยังทำงานอยู่
      description: ตอบทันทีโดยไม่แตะ database หรือ redis ใช้กับ health check ของ container
      responses:
        "200":
          description: Process ยังทำงานอยู่
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
  /live:
    get:
      tags:
        - System
      summary: ตรวจว่า process ยังทำงานอยู่ (ค่าเดียวกับ /livez)
      description: ตอบผลเหมือน GET /livez ทุกประการ
      responses:
        "200":
          description: Process ยังทำงานอยู่
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
