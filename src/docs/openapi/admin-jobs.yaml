          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/vehicle-jobs/{ticketNumber}/tickets/{ticketNo}/stalls/{stallCode}/override-count:
    post:
      tags:
        - Admin Jobs
      summary: ส่งยอดสินค้าแทน Worker
      description: >
        Admin ส่งจำนวนสินค้าของ Booth ตาม ticketNumber, ticketNo และ stallCode เมื่อ Worker ส่งเองไม่ได้ ระบบส่งเข้า flow ยืนยันจาก Vendor เหมือนการส่งยอดปกติ
        หลังส่งสำเร็จ ถ้าทุก Booth ของ VehicleJob นี้ถูกส่งยอด/ยืนยัน/ยกเลิกครบแล้ว และ Worker ทั้งทีมหมดกะไปแล้วทุกคน ระบบจะปล่อยทั้งทีมกลับคิว (เทียบเท่า release-workers) ให้อัตโนมัติโดยไม่ต้องรอ Admin กดแยก — ถ้ามีแค่บางคนในทีมหมดกะ ยังต้องให้ Admin กด release-workers เองเพื่อปล่อยทั้งทีม
      operationId: overrideAdminTicketProductCounts
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: ticketNumber
          required: true
          schema:
            type: string
            example: TRUCK-20260723-001
        - in: path
          name: ticketNo
          required: true
          schema:
            type: string
            example: TKT-20260723-000125
        - in: path
          name: stallCode
          required: true
          schema:
            type: string
            example: OM3/40
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminOverrideCountRequest"
      responses:
        "200":
          description: ส่งยอดของแผงค้าสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverrideCountResponse"
        "400":
          description: ข้อมูลไม่ผ่านการตรวจสอบ หรือส่งสินค้ามาไม่ครบ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: บัญชี Admin ที่ login อยู่ไม่มี permission jobs:override_count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ไม่พบงานรถหรือแผงค้านี้
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: แผงค้านี้รับการส่งยอดใหม่ไม่ได้แล้ว
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/vehicle-jobs/{ticketNumber}/wait:
    post:
      tags:
        - Admin Jobs
      summary: เปลี่ยน Status Dispatch ของงานรถ
      description: >
        Admin เปลี่ยนสถานะ Dispatch ของงานรถกลับไปรอลง unload ด้วยการกำหนด "DispatchNow": false และบันทึกเหตุผลลง timeline
