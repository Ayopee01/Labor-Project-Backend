      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminVehicleWaitRequest"
      responses:
        "200":
          description: เปลี่ยนสถานะ Dispatch ของงานรถสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleWaitResponse"
        "403":
          description: บัญชี Admin ที่ login อยู่ไม่มี permission jobs:wait
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ไม่พบงานรถนี้
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            VEHICLE_JOB_CLOSED (งานรถนี้เป็น COMPLETED/CANCELLED ไปแล้ว) หรือ VEHICLE_JOB_ALREADY_STARTED
            (ทั้งทีมเช็คอินและเริ่มทำงานไปแล้ว เปลี่ยน dispatch ไม่ได้อีก)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/vehicle-jobs/{ticketNumber}/release-workers:
    post:
      tags:
        - Admin Jobs
      summary: ปล่อยทีม Worker กลับคิว
      description: >
        Admin ปล่อยทีม Worker กลับ FIFO queue หลังทุก Booth ถูกส่งยอดแล้ว แม้ยังรอ Vendor confirm อยู่ โดยไม่ปิดสถานะ booth/ticket ทันที
      operationId: releaseAdminVehicleJobWorkers
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: ticketNumber
          required: true
          schema:
            type: string
            example: TRUCK-20260723-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReleaseWorkersRequest"
      responses:
        "200":
          description: ปล่อย Worker กลับ FIFO queue สำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReleaseWorkersResponse"
        "403":
          description: บัญชี Admin ที่ login อยู่ไม่มี permission jobs:release_workers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ไม่พบงานรถนี้
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            งานรถนี้ปิดไปแล้ว (VEHICLE_JOB_CLOSED) ยังไม่มีแผงค้าไหนส่งยอดเลย (NO_SUBMITTED_BOOTHS) มีแผงค้า
            ที่ยังอยู่สถานะ WAIT/WORKING/REJECT (BOOTHS_NOT_SUBMITTED) หรือไม่มี Worker ที่ปล่อยได้เลย
            (NO_RELEASABLE_WORKERS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
