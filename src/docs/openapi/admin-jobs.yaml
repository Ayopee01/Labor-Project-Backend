          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: บัญชี Admin ที่ login อยู่ไม่มี permission jobs:extend_deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
