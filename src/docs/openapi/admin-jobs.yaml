paths:
  /api/admin/jobs/workers/status:
    get:
      tags:
        - Admin Jobs
      summary: ดูสถานะ Worker สำหรับ Admin board
      description: >
        คืนสถานะ Worker ในกะปัจจุบันพร้อมตำแหน่งคิวและสถานะ WebSocket เพื่อจัดเรียงหน้าควบคุมงานของ Admin
      operationId: listAdminJobWorkerStatuses
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            example: 1
          description: ไม่บังคับ ถ้าไม่ส่งมาจะคืนรายการทั้งหมดโดยไม่แบ่งหน้าเหมือนเดิม ถ้าส่งมา API จะคืนเฉพาะหน้านั้นพร้อม pagination metadata หลัง filter/sort แล้ว
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            example: 20
          description: จำนวนรายการต่อหน้า (ไม่บังคับ) ใช้เฉพาะตอนส่ง page มา
      responses:
        "200":
          description: >-
            รายการสถานะ Worker ของกะปัจจุบันสำหรับหน้าปฏิบัติการของ Admin Worker ที่มี queue/assignment
            active อยู่จะยังแสดงอยู่แม้ WebSocket จะหลุดไปแล้ว — ใช้ SocketConnected เพื่อดูสถานะการเชื่อมต่อ
            ข้อมูลเรียงตามคอลัมน์ status และ status_entered_at โดย Worker ที่ ready จะเรียงตาม Redis
            queue_position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWorkerStatusListResponse"
        "403":
          description: บัญชีที่ login อยู่ไม่มี permission jobs:read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/jobs/workers/{workerCode}/status/force:
    post:
      tags:
        - Admin Jobs
      summary: บังคับเปลี่ยนสถานะ Worker
      description: >
        Admin ใช้แก้สถานะ Worker เมื่อหน้างานผิดปกติ ระบบตรวจเงื่อนไขงานที่ค้างและบันทึกเหตุผลลง audit log
      operationId: forceAdminJobWorkerStatus
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: workerCode
          required: true
          schema:
            type: string
          description: WorkerCode เช่น MN000115
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminForceWorkerStatusRequest"
      responses:
        "200":
          description: บังคับเปลี่ยนสถานะ Worker สำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminForceWorkerStatusResponse"
        "400":
          description: ไม่ได้ส่ง reason_code มา
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            Worker ถูกปิดใช้งาน ไม่มีตารางกะสำหรับการบังคับพัก อยู่นอกเวลากะที่กำหนด (WORKER_OUTSIDE_WORK_SHIFT
            — Admin ต้องแก้เวลากะของ Worker ก่อนถึงจะบังคับสถานะเป้าหมายใดๆ ได้) หรือผู้เรียกไม่มี
            permission workers:force_status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Worker ไม่ได้ online อยู่ มี assignment ที่ active อยู่แล้ว หรือพักครบจำนวนครั้งที่กำหนดแล้ว
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/vehicle-jobs/operations:
    get:
      tags:
        - Admin Jobs
      summary: ดูรายการงานรถสำหรับหน้าปฏิบัติการ
      description: >
        คืน vehicle jobs ที่ยังใช้ติดตามหน้างาน พร้อม worker, market, booth, product และ summary สำหรับ Admin operation board
      operationId: listAdminVehicleJobOperations
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: date
          schema:
            type: string
            format: date
            example: "2026-07-07"
          description: กรองแบบวันเดียว (รูปแบบเก่า ไม่บังคับ) รูปแบบ YYYY-MM-DD เทียบเท่ากับส่ง date_from และ date_to เป็นวันเดียวกัน
        - in: query
          name: date_from
          schema:
            type: string
            format: date
            example: "2026-07-01"
          description: วันเริ่มต้นของช่วงวันที่สร้าง (ไม่บังคับ) รูปแบบ YYYY-MM-DD ตามเวลา Asia/Bangkok
        - in: query
          name: date_to
          schema:
            type: string
            format: date
            example: "2026-07-07"
          description: วันสิ้นสุดของช่วงวันที่สร้าง (ไม่บังคับ, รวมวันนี้) รูปแบบ YYYY-MM-DD ตามเวลา Asia/Bangkok
        - in: query
          name: time_from
          schema:
            type: string
            example: "08:00"
          description: เวลา HH:mm สำหรับจำกัดจุดเริ่มต้นของช่วงให้แคบกว่าค่า default 00:00 ของ date/date_from (ไม่บังคับ) ต้องส่ง date หรือ date_from มาด้วย ตามเวลา Asia/Bangkok
        - in: query
          name: time_to
          schema:
            type: string
            example: "18:00"
          description: เวลา HH:mm สำหรับจำกัดจุดสิ้นสุดของช่วงให้แคบกว่าค่า default สิ้นวันของ date/date_to (ไม่บังคับ) ต้องส่ง date หรือ date_to มาด้วย รวมนาทีที่ระบุ ตามเวลา Asia/Bangkok
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            example: 1
          description: ไม่บังคับ ถ้าส่งมา API จะคืนเฉพาะหน้านั้นพร้อม pagination metadata หลังกรองด้วย operation_status แล้ว
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            example: 20
          description: จำนวนรายการต่อหน้า (ไม่บังคับ) ใช้เฉพาะตอนส่ง page มา ค่าเริ่มต้นคือ 20
        - in: query
          name: search
          schema:
            type: string
          description: ค้นหาจาก ticketNo, ทะเบียนรถ, gate transaction ref, marketCode/marketName, boothCode/boothName, productCode/productName/packageCode/packageName
        - in: query
          name: operation_status
          schema:
            type: string
            enum:
              - cancelled
              - completed
              - reject
              - wait_unload
              - wait_worker
              - ready_now
              - working
          description: >-
            สถานะระดับงานรถที่มีได้ค่าเดียว (ไม่ซ้อนกัน) — ดู AdminVehicleOperationStatus สำหรับลำดับ
            ความสำคัญเต็มที่ใช้ตัดสิน reject หมายถึงมีแผงค้าอย่างน้อยหนึ่งแผงอยู่สถานะ REJECT ที่ยังไม่แก้ไข
            (ขอบเขตเทียบเท่ากับ has_issue=true แต่เป็นค่า status แทนที่จะเป็น boolean แยก) working ยังรวมถึง
            งานรถที่ถูก release ก่อนกำหนดผ่าน release-workers ด้วย (VehicleJob.status=RELEASED ทุกแผงค้าส่ง
            ยอดแล้ว รอแค่ Vendor ยืนยัน/timeout) เพราะงานยังไม่เสร็จจริง — filter หรือเช็ค vehicle_job.status
            โดยตรงถ้าต้องการแยกงานที่ release แล้วออกมาเฉพาะ
        - in: query
          name: status
          schema:
            type: string
          description: กรองตาม vehicle_job.status โดยตรง (เช่น WORKING) แยกจาก operation_status ที่แยกแยะค่านี้ไม่ได้ (ไม่บังคับ)
        - in: query
          name: has_issue
          schema:
            type: boolean
          description: >-
            ไม่บังคับ ถ้าเป็น true จะคืนเฉพาะงานรถที่มีแผงค้าอย่างน้อยหนึ่งแผงอยู่สถานะ REJECT ในปัจจุบัน
            (market_summary.rejected > 0) — เป็นรถชุดเดียวกับที่ operation_status=reject จะคืนให้ เก็บไว้
            เป็น boolean filter แยกต่างหากเพื่อความสะดวก
        - in: query
          name: dropoff_point
          schema:
            type: string
          description: >-
            ไม่บังคับ กรองเฉพาะงานรถที่มี MarketJob อย่างน้อยหนึ่งรายการที่ dropoff_point ตรงกับค่านี้เป๊ะ
            (ไม่สนตัวพิมพ์เล็ก/ใหญ่) กรองที่ระดับ database query พร้อมกับ search และช่วงวันที่ เพราะฉะนั้น
            summary และ pagination จะคำนวณหลัง filter นี้แล้ว — ต่างจาก operation_status/status/has_issue
            ที่กรองจาก list ที่สร้างเสร็จแล้ว
      responses:
        "200":
          description: รายการงานรถสำหรับหน้าปฏิบัติการ พร้อม summary, worker, market, stall job และสินค้า
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleJobOperationListResponse"
        "403":
          description: บัญชีที่ login อยู่ไม่มี permission jobs:read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/vehicle-jobs/history:
    get:
      tags:
        - Admin Jobs
      summary: ดูประวัติงานรถ
      description: >
        คืนประวัติงานรถตามช่วงวันที่และตัวกรอง พร้อม market, booth, worker, timeline และข้อมูลการเงินที่ persist ไว้
      operationId: listAdminVehicleJobHistory
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: date
          schema:
            type: string
            format: date
            example: "2026-07-07"
          description: กรองแบบวันเดียว (รูปแบบเก่า ไม่บังคับ) รูปแบบ YYYY-MM-DD เทียบเท่ากับส่ง date_from และ date_to เป็นวันเดียวกัน
        - in: query
          name: date_from
          schema:
            type: string
            format: date
            example: "2026-07-01"
          description: วันเริ่มต้นของช่วงวันที่สร้าง (ไม่บังคับ) รูปแบบ YYYY-MM-DD ตามเวลา Asia/Bangkok
        - in: query
          name: date_to
          schema:
            type: string
            format: date
            example: "2026-07-07"
          description: วันสิ้นสุดของช่วงวันที่สร้าง (ไม่บังคับ, รวมวันนี้) รูปแบบ YYYY-MM-DD ตามเวลา Asia/Bangkok
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            example: 1
          description: ไม่บังคับ ถ้าส่งมา API จะคืนเฉพาะหน้านั้นพร้อม pagination metadata ถ้าไม่ส่งจะคืนทุกแถวที่ตรงเงื่อนไข
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            example: 20
          description: จำนวนรายการต่อหน้า (ไม่บังคับ) ใช้เฉพาะตอนส่ง page มา ค่าเริ่มต้นคือ 20
        - in: query
          name: search
          schema:
            type: string
          description: ค้นหาจาก ticketNo, ทะเบียนรถ, gate transaction ref, marketCode/marketName, boothCode/boothName, productCode/productName/packageCode/packageName
        - in: query
          name: status
          schema:
            type: string
            enum:
              - WAIT
              - WORKING
              - RELEASED
              - DELIVERED
              - REJECT
              - COMPLETED
              - CANCELLED
              - PENDING
              - ACCEPTED
              - SCANNED
              - TIMEOUT
          description: กรองตามสถานะระดับ vehicle, market, stall, stall confirmation หรือ worker assignment
        - in: query
          name: history_status
          schema:
            type: string
            enum:
              - ALL
              - COMPLETED
              - CANCELLED
              - REJECT_PENDING
          description: >-
            ไม่บังคับ กลุ่มธุรกิจของ Work History แยกต่างหากจาก status ด้านบน — ALL หมายถึง OR ของ
            COMPLETED, CANCELLED และ REJECT_PENDING เท่านั้น ไม่ใช่ทุกสถานะใน database REJECT_PENDING คือ
            งานรถที่ยังไม่จบ (status ไม่อยู่ใน COMPLETED/CANCELLED) และมีแผงค้า (BoothJob) อย่างน้อยหนึ่ง
            แผงอยู่สถานะ REJECT อยู่ในปัจจุบัน ลำดับความสำคัญของกลุ่มคือ CANCELLED > COMPLETED >
            REJECT_PENDING กรองที่ระดับ database query เพื่อให้ pagination.total และ
            available_dropoff_points สะท้อนชุดที่กรองแล้ว ถ้าส่งมาพร้อมกับ status ด้านบน ทั้งคู่จะเป็นเงื่อนไข AND
        - in: query
          name: dropoff_point
          schema:
            type: string
          description: >-
            ไม่บังคับ กรองเฉพาะงานรถที่มี MarketJob อย่างน้อยหนึ่งรายการที่ dropoff_point ตรงกับค่านี้เป๊ะ
            (ไม่สนตัวพิมพ์เล็ก/ใหญ่) กรองที่ระดับ database query เพื่อให้ pagination.total สะท้อนชุดที่กรองแล้ว
      responses:
        "200":
          description: >-
            รายการประวัติงานรถ พร้อม market, stall job และสินค้า แต่ละรายการยังมี workers (Worker ที่กดรับ
            dispatch จริง ตัดซ้ำเหลือหนึ่งแถวต่อ worker_account_id — ดู AdminHistoryWorker), timeline
            (รวมเหตุการณ์ตามลำดับเวลาของ worker lifecycle, การส่งยอด/ปฏิเสธ/ยืนยันของแผงค้า และ action ของ
            admin), finance (ยอดรวมระดับงานที่ใช้ข้อมูลการเงินที่บันทึกไว้ชุดเดียวกับ /financials รวมถึง
            รายได้จริงแยกตาม Worker — ดู AdminHistoryFinance) และ timestamp ระดับงานที่คำนวณแล้ว
            (ticket_created_at, work_started_at, submitted_complete_at, completed_at,
            duration_seconds) รวมถึง history_status (กลุ่มธุรกิจของ Work History ที่งานรถนี้สังกัด หรือ
            null ถ้าไม่เข้ากลุ่มไหน — ดู query parameter history_status ด้านบน) ทุกอย่างในนี้ไม่มีการคำนวณใหม่
            จากสูตรใดๆ อ่านจากข้อมูลที่บันทึกไว้อยู่แล้วทั้งหมด
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleJobListResponse"
        "403":
          description: บัญชีที่ login อยู่ไม่มี permission jobs:read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/vehicle-jobs/history/daily-worker-income:
    get:
      tags:
        - Admin Jobs
      summary: ดูรายได้รายวันของ Worker
      description: >
        คืนรายได้ของ Worker แบบหนึ่งแถวต่อ Worker ต่อ Business Ticket พร้อมสถานะงานและ riskText สำหรับรายงานรายวัน
      operationId: listAdminDailyWorkerIncome
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: date_from
          schema:
            type: string
            format: date
            example: "2026-07-01"
          description: วันเริ่มต้นของช่วงวันที่สร้าง รูปแบบ YYYY-MM-DD ตามเวลา Asia/Bangkok
        - in: query
          name: date_to
          schema:
            type: string
            format: date
            example: "2026-07-07"
          description: วันสิ้นสุดของช่วงวันที่สร้าง (รวมวันนี้) รูปแบบ YYYY-MM-DD ตามเวลา Asia/Bangkok
        - in: query
          name: from
          schema:
            type: string
            format: date
          description: ชื่อเรียกอื่นของ date_from
        - in: query
          name: to
          schema:
            type: string
            format: date
          description: ชื่อเรียกอื่นของ date_to
        - in: query
          name: worker_code
          schema:
            type: string
          description: กรองเฉพาะแถวของ Worker คนนี้
        - in: query
          name: workerCode
          schema:
            type: string
          description: ชื่อเรียกอื่นของ worker_code
        - in: query
          name: status
          schema:
            type: string
          description: กรองตามสถานะ TicketWorker
        - in: query
          name: shift
          schema:
            type: string
            enum:
              - Morning
              - Evening
          description: กรองตามกะของ Worker
        - in: query
          name: search
          schema:
            type: string
          description: ค้นหาจาก ticketNo, ทะเบียนรถ, marketCode/marketName หรือรหัส/ชื่อ Worker
        - in: query
          name: keyword
          schema:
            type: string
          description: ชื่อเรียกอื่นของ search
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: ชื่อเรียกอื่นของ limit
      responses:
        "200":
          description: หนึ่งแถวต่อ Worker หนึ่งคนต่อ Business Ticket หนึ่งใบ พร้อมยอดที่ล็อกไว้แล้ว
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDailyWorkerIncomeListResponse"
        "403":
          description: บัญชี Admin ที่ login อยู่ไม่มี permission jobs:read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/vehicle-jobs/history/daily-stall-fees:
    get:
      tags:
        - Admin Jobs
      summary: ดูรายงานค่าลงสินค้าแผงค้ารายวัน
      description: >
        คืนรายงานค่าลงสินค้าแผงค้าแบบหนึ่งแถวต่อ TicketProductFinancial ที่ finalize แล้ว (join
        TicketProductFinancial -> TicketProduct -> BoothJob -> MarketJob -> TicketJob) พร้อม
        summary ของทั้ง filtered set (ไม่ใช่แค่หน้าปัจจุบัน) — Data/summary ใช้ทั้ง product_code และ
        package_code พร้อมกันตามที่ส่งมา ส่วน available_products/available_packages เป็น faceted
        dropdown คนละทิศทางกัน: available_products แคบลงตาม package_code ที่เลือกไว้เท่านั้น (ไม่แคบ
        ตาม product_code ของตัวเอง) และ available_packages แคบลงตาม product_code ที่เลือกไว้เท่านั้น
        (ไม่แคบตาม package_code ของตัวเอง) — ทั้งคู่ไม่เปลี่ยนตาม page/limit และคู่ product_code +
        package_code ที่ไม่เคยอยู่ในแถวเดียวกันจะคืน 200 พร้อม data ว่างและ summary เป็นศูนย์
      operationId: listAdminDailyStallFees
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: date_from
          required: true
          schema:
            type: string
            format: date
            example: "2026-08-01"
          description: วันเริ่มต้นของช่วงรายงาน รูปแบบ YYYY-MM-DD ตามเวลา Asia/Bangkok ต้องส่งมา
        - in: query
          name: date_to
          required: true
          schema:
            type: string
            format: date
            example: "2026-08-31"
          description: >-
            วันสิ้นสุดของช่วงรายงาน (รวมวันนี้) รูปแบบ YYYY-MM-DD ตามเวลา Asia/Bangkok ต้องส่งมา
            ช่วงห้ามเกิน 31 วันปฏิทิน
        - in: query
          name: search
          schema:
            type: string
          description: >-
            ค้นหาแบบหลาย token (แยกด้วยช่องว่าง/comma แต่ละ token ต้องตรงกับอย่างน้อยหนึ่ง field ไม่สนตัว
            พิมพ์เล็ก/ใหญ่) ค้นจากรหัสแผงค้า ทะเบียนรถ ticket_no รหัส/ชื่อสินค้า และรหัส/ชื่อ Package
        - in: query
          name: product_code
          schema:
            type: string
          description: >-
            ตรงกับ TicketProduct.productCode เป๊ะ — มีผลกับ Data/summary/pagination และทำให้
            available_packages แคบลง (ไม่ทำให้ available_products แคบลง เพราะไม่แคบตามมิติของตัวเอง)
        - in: query
          name: package_code
          schema:
            type: string
          description: >-
            ตรงกับ TicketProduct.packageCode เป๊ะ — มีผลกับ Data/summary/pagination และทำให้
            available_products แคบลง (ไม่ทำให้ available_packages แคบลง เพราะไม่แคบตามมิติของตัวเอง)
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: หนึ่งแถวต่อ TicketProductFinancial ที่ finalize แล้วภายในช่วงวันที่เลือก
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDailyStallFeeListResponse"
        "400":
          description: ไม่ได้ส่งช่วงวันที่มาหรือส่งมาไม่ถูกต้อง หรือ query ไม่ผ่านการตรวจสอบ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: บัญชี Admin ที่ login อยู่ไม่มี permission jobs:read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/vehicle-jobs/history/monthly-stall-fees:
    get:
      tags:
        - Admin Jobs
      summary: ดูรายงานค่าลงสินค้าแผงค้ารายเดือน
      description: >
        คืนรายงานค่าลงสินค้าแผงค้าแบบ group ต่อ market_code + booth_code + shirt_color (ต่างจาก
        daily-stall-fees ที่ list ทีละแถว TicketProductFinancial ตรงๆ) — SUM(stall_fee_rounded) และ
        COUNT ของ TicketProductFinancial ที่ finalize แล้วในช่วงวันที่เลือก ยอดต้อง reconcile กับผลรวม
        ของ daily-stall-fees ในช่วงวันเดียวกันได้เสมอ เพราะใช้แหล่งข้อมูลเดียวกัน แค่ group ต่างกัน
        shirt_color เป็น immutable snapshot ที่บันทึกไว้ตอน finalize (TicketProductFinancial.shirtColorSnapshot)
        ไม่ใช่สีปัจจุบันของ MasterWorker: เป็นสีจริงจาก master data ตรงๆ เมื่อ worker ทุกคนในแผงนั้นสีตรงกันเป๊ะ
        (ไม่ผูกกับ whitelist คงที่ รองรับสีใหม่ที่ master data เพิ่มมาในอนาคตได้ทันที), MIXED เมื่อมีมากกว่าหนึ่ง
        สีปนกัน, UNKNOWN เมื่อไม่มี snapshot (ข้อมูลเก่าก่อนมีฟีเจอร์นี้) หรือไม่มีค่าสี รองรับช่วงวันที่ข้ามเดือน/ปีได้ตามปกติ (ไม่บังคับเดือนเดียวเหมือน
        daily-stall-fees) แค่ห้ามเกิน 6 เดือนปฏิทินนับจาก date_from — summary และ available_markets/
        available_stalls/available_shirt_colors มาจาก filtered set ทั้งหมด ไม่เปลี่ยนตาม page/limit
        เหมือน daily-stall-fees, available_stalls แต่ละแถวผูกกับ market_code ของมันเสมอ
      operationId: listAdminMonthlyStallFees
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: date_from
          required: true
          schema:
            type: string
            format: date
            example: "2026-12-01"
          description: วันเริ่มต้นของช่วงรายงาน รูปแบบ YYYY-MM-DD ตามเวลา Asia/Bangkok ต้องส่งมา
        - in: query
          name: date_to
          required: true
          schema:
            type: string
            format: date
            example: "2027-01-31"
          description: >-
            วันสิ้นสุดของช่วงรายงาน (รวมวันนี้) รูปแบบ YYYY-MM-DD ตามเวลา Asia/Bangkok ต้องส่งมา ข้ามเดือน/
            ปีได้อย่างอิสระ แต่ช่วงห้ามเกิน 6 เดือนปฏิทินนับจาก date_from
        - in: query
          name: market_search
          schema:
            type: string
          description: >-
            ตรงบางส่วนกับ MarketJob.marketCode หรือ marketName (ไม่สนตัวพิมพ์เล็ก/ใหญ่) — มีผลกับ
            Data/summary/pagination และทำให้ available_stalls แคบลง (ไม่ทำให้ available_markets แคบลง
            เพราะไม่แคบตามมิติของตัวเอง)
        - in: query
          name: booth_search
          schema:
            type: string
          description: >-
            ตรงบางส่วนกับ BoothJob.boothCode (ไม่สนตัวพิมพ์เล็ก/ใหญ่) — มีผลกับ Data/summary/pagination
            และทำให้ available_markets แคบลง (ไม่ทำให้ available_stalls แคบลง เพราะไม่แคบตามมิติของตัวเอง)
        - in: query
          name: shirt_color
          schema:
            type: string
          description: >-
            ตรงกับสีเสื้อที่บันทึก snapshot ไว้เป๊ะ — ไม่ใช่ enum ตายตัว รับสีใดก็ได้ที่มีใน master data
            รวมถึง MIXED/UNKNOWN มีผลกับ Data/summary/pagination และทำให้ available_markets/
            available_stalls แคบลง (ไม่ทำให้ available_shirt_colors แคบลง เพราะไม่แคบตามมิติของตัวเอง)
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: หนึ่งแถวต่อกลุ่ม market_code + booth_code + shirt_color หนึ่งกลุ่มภายในช่วงวันที่เลือก
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMonthlyStallFeeListResponse"
        "400":
          description: ไม่ได้ส่งช่วงวันที่มาหรือส่งมาไม่ถูกต้อง (รวมถึงเกิน 6 เดือน) หรือ query ไม่ผ่านการตรวจสอบ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: บัญชี Admin ที่ login อยู่ไม่มี permission jobs:read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/vehicle-jobs/{ticketNumber}/financials:
    get:
      tags:
        - Admin Jobs
      summary: ดูรายละเอียดการเงินของงานรถ
      description: >
        คืนยอดเงินที่ finalize แล้วของ vehicle job แยกตาม booth, product และ worker โดยอ่านจากข้อมูลที่ persist ไว้ ไม่คำนวณใหม่จาก master rate
      operationId: getAdminVehicleJobFinancials
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: ticketNumber
          required: true
          schema:
            type: string
            example: TRUCK-20260723-001
          description: TicketNumber ของงานรถ
      responses:
        "200":
          description: รายละเอียดการเงินของงานรถที่บันทึกไว้
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleJobFinancialResponse"
        "403":
          description: บัญชี Admin ที่ login อยู่ไม่มี permission jobs:read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ไม่พบงานรถนี้
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/vehicle-jobs/assignment/cancel:
    post:
      tags:
        - Admin Jobs
      summary: ยกเลิกงานหรือ assignment ตาม scope
      description: >
        Admin ส่ง TicketNumber และตัวเลือก ticketNo, boothCode หรือ workerCode เพื่อยกเลิกทั้งรถ ทั้ง Business Ticket เฉพาะ Booth หรือ Worker รายคนใน endpoint เดียว
      operationId: cancelAdminVehicleJobAssignment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminVehicleJobAssignmentCancelRequest"
      responses:
        "200":
          description: ยกเลิกสำเร็จ — รูปแบบ response ขึ้นอยู่กับขอบเขตที่ resolve ได้ ดู AdminVehicleJobAssignmentCancelResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVehicleJobAssignmentCancelResponse"
        "400":
          description: INVALID_CANCEL_SCOPE — ส่ง boothCode มาโดยไม่มี ticket_no
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ไม่พบเป้าหมายของขอบเขตที่ resolve ได้ (เช่น MARKET_JOB_NOT_FOUND, STALL_JOB_NOT_FOUND, ASSIGNMENT_NOT_FOUND, TICKET_WORKER_NOT_FOUND, WORKER_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: บัญชี Admin ที่ login อยู่ไม่มี permission jobs:cancel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            เป้าหมายของขอบเขตที่ resolve ได้ปิดไปแล้วหรือส่งยอดไปแล้ว เช่น VEHICLE_JOB_CLOSED (เฉพาะขอบเขตทั้งคัน
            เท่านั้น — รถคันนี้เป็น COMPLETED หรือ CANCELLED ไปแล้ว โดย lock แถวนี้แล้วตรวจสถานะซ้ำในทรานแซกชัน
            เดียวกับการยกเลิก จึงบล็อกรถที่เพิ่งถูกปิดจาก vendor confirm พร้อมกันได้ด้วย), MARKET_JOB_ALREADY_CLOSED,
            MARKET_JOB_ALREADY_SUBMITTED, STALL_JOB_ALREADY_CLOSED, STALL_JOB_ALREADY_SUBMITTED,
            ASSIGNMENT_NOT_ACTIVE, WORKER_ALREADY_EXCLUDED_FROM_BOOTH (เฉพาะขอบเขต worker + booth เท่านั้น —
            ดูเอกสารเดิมของ endpoint แยกตามขอบเขตที่ถูกรวมเข้ามาแล้วสำหรับเงื่อนไขที่แต่ละขอบเขตบังคับใช้) การยกเลิก
            Business Ticket หรือ Booth จะไม่เขียนทับ Market/Booth พี่น้องที่ถึง COMPLETED/CANCELLED ไปแล้ว และจะ
            roll สถานะของ Business Ticket/งานรถแม่ขึ้นเสมอผ่าน lifecycle กลางชุดเดียวกับที่ vendor confirm ใช้
            (finalize การเงินด้วยถ้าเข้าเงื่อนไข)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/vehicle-jobs/{ticketNumber}/assign-workers:
    post:
      tags:
        - Admin Jobs
      summary: assign งานรถให้ Worker เอง
      description: >
        Admin เลือก Worker ที่พร้อมใน queue ให้รับ vehicle job โดยระบบตรวจจำนวนคนและสถานะกะก่อนสร้าง assignment
        พร้อมบันทึก MANUAL_ASSIGNMENT ลง admin_action_logs (actor = admin ที่ authenticated, metadata เก็บ
        assignment_ids/worker_account_ids/worker_codes)
      operationId: assignAdminVehicleJobWorkers
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: ticketNumber
          required: true
          schema:
            type: string
            example: TRUCK-20260723-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAssignWorkersRequest"
      responses:
        "201":
          description: Assign Worker สำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAssignWorkersResponse"
        "400":
          description: ไม่ได้ส่ง reason_code มา
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            มี Worker ในรายการอยู่นอกเวลากะของตัวเอง (WORKER_OUTSIDE_WORK_SHIFT) — เช็คแม้สถานะ queue ของ
            Worker จะแสดงว่า ready แล้ว เพราะ ready อย่างเดียวไม่ได้การันตีว่า Worker อยู่ในช่วงเวลากะปัจจุบันจริง
            หรือบัญชี Admin ที่ login อยู่ไม่มี permission jobs:assign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/vehicle-jobs/{ticketNumber}/scan-deadline/extend:
