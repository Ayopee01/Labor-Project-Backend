paths:
  /api/line/webhook:
    post:
      tags:
        - LINE
      summary: รับ webhook จาก LINE ของ Vendor
      description: >
        รับ postback จากปุ่ม confirm, reject และ rating ใน LINE Flex message แล้วอัปเดตสถานะ ticket ตาม token ที่แนบมา
        ถ้างานครบทุก ticket ระบบจะปิดงานที่เกี่ยวข้องและคืน Worker ไปงานถัดไป นอกจากนี้ยังรองรับ event ประเภท message
        (ข้อความ text) — ถ้าพิมพ์คำว่า "id" มา (ไม่สนตัวพิมพ์เล็ก/ใหญ่) ระบบจะตอบกลับ LINE user id ของผู้พิมพ์ทันทีผ่าน
        LINE Reply API (ข้อความ "Your user ID: <id>") เพื่อความสะดวกตอน setup ข้อมูลทดสอบ เช่นเอาไปใส่
        POST /api/line/dev/member-stalls — การตอบแบบนี้ไม่นับรวมโควต้าข้อความ push ฟรีรายเดือนของ LINE OA
      operationId: handleLineWebhook
      parameters:
        - in: header
          name: x-line-signature
          schema:
            type: string
          required: false
          description: ต้องส่งมาถ้าตั้งค่า LINE_CHANNEL_SECRET ไว้
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineWebhookRequest"
      responses:
        "200":
          description: ประมวลผล LINE webhook สำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineWebhookResponse"
        "401":
          description: ไม่ได้ส่ง header x-line-signature มา หรือค่าลายเซ็นไม่ตรงกับที่คำนวณจาก LINE_CHANNEL_SECRET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: ยังไม่ได้ตั้งค่า LINE_CHANNEL_SECRET ไว้บน server นี้
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/line/dev:
    get:
      tags:
        - LINE
      summary: หน้าเว็บ LINE dev tester
      description: หน้า HTML แบบ standalone สำหรับยืนยัน/ปฏิเสธยอดส่งงานแทนการกดปุ่มจาก LINE จริง ใช้เป็นทางสำรองเมื่อ LINE Messaging API ติด rate limit ไม่ต้องยืนยันตัวตนและเปิดใช้งานได้ทั้งใน production
      operationId: getLineDevPage
      responses:
        "200":
          description: หน้า LINE dev tester
          content:
            text/html:
              schema:
                type: string
  /api/line/dev/submissions:
    get:
      tags:
        - LINE
      summary: ดึงรายการ Submission สำหรับหน้า LINE dev tester
      description: คืนรายการ ticket completion submission ทั้งหมดพร้อมสถานะว่ารายการไหนสามารถกด confirm/reject ได้ ไม่ต้องยืนยันตัวตนและเปิดใช้งานได้ทั้งใน production
      operationId: listLineDevSubmissions
      responses:
        "200":
          description: รายการ submission สำหรับ LINE dev tester
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineDevSubmissionListResponse"
  /api/line/dev/submissions/{submissionId}/confirm:
    post:
      tags:
        - LINE
      summary: ยืนยันยอดส่งงานจากหน้า LINE dev tester
      description: ยืนยัน ticket completion submission ด้วย flow เดียวกับตอน vendor กดปุ่ม confirm ใน LINE แต่จะไม่ส่งข้อความผ่าน LINE Messaging API ไม่ต้องยืนยันตัวตนและเปิดใช้งานได้ทั้งใน production
      operationId: confirmLineDevSubmission
      parameters:
        - in: path
          name: submissionId
          required: true
          schema:
            type: integer
          example: 501
      responses:
        "200":
          description: ยืนยัน submission สำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineDevCompletionResult"
        "404":
          description: ไม่พบ ticket completion submission นี้
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Submission นี้ถูกยืนยัน ปฏิเสธ หรือถูกแทนที่ด้วยรายการอื่นไปแล้ว
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/line/dev/member-stalls:
    post:
      tags:
        - LINE
      summary: เพิ่ม test member (ลูกแผง) ให้เจ้าของแผงที่ระบุ หรือทุกแผงที่ active
      description: >
        เพิ่ม LINE user id หนึ่งตัวให้เป็น "ลูกแผง" (member) ของเจ้าของแผงตาม `booths` ที่ระบุ
        ถ้าไม่ส่ง `booths` จะเพิ่มให้เจ้าของแผงทุกแผงที่ active และมี LINE user id
        (ไม่ซ้ำตาม marketCode + ownerIdCard เพราะลูกแผงผูกกับเจ้าของ จึงได้รับแจ้งเตือนทุกแผงของเจ้าของคนนั้นในตลาดนั้น)
        ใช้ทดสอบว่า LINE account ที่เพิ่มเพื่อน OA ทดสอบแล้วได้รับ push แจ้งเตือน ticket completion
        ถ้า LINE user id นี้เป็นลูกแผงของเจ้าของในขอบเขตที่ขออยู่แล้วจะตอบ 409 และไม่เพิ่มข้อมูลใดเลย
        ไม่ต้องยืนยันตัวตนและเปิดใช้งานได้ทั้งใน production
      operationId: addLineDevMemberStall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineDevAddMemberStallRequest"
      responses:
        "200":
          description: เพิ่ม member stall สำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineDevAddMemberStallResult"
        "400":
          description: body ไม่ถูกต้อง (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >
            OWNER_STALL_NOT_FOUND — แผงใน `booths` บางแผงไม่มีเจ้าของที่ active และมี LINE user id
            (`details.booths` คือรายการแผงที่ไม่พบ) หรือไม่มีเจ้าของแผงที่ active เลยในระบบ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            MEMBER_STALL_ALREADY_EXISTS — member_stall_line_user_id นี้เป็นลูกแผงของเจ้าของในขอบเขตที่ขออยู่แล้ว
            (`details.owners` คือ market_code + owner_id_card ที่ซ้ำ)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/line/dev/submissions/{submissionId}/reject:
    post:
      tags:
        - LINE
      summary: ปฏิเสธยอดส่งงานจากหน้า LINE dev tester
      description: ปฏิเสธ ticket completion submission ด้วย flow เดียวกับตอน vendor กดปุ่ม reject ใน LINE แต่จะไม่ส่งข้อความผ่าน LINE Messaging API ไม่ต้องยืนยันตัวตนและเปิดใช้งานได้ทั้งใน production
      operationId: rejectLineDevSubmission
      parameters:
        - in: path
          name: submissionId
          required: true
          schema:
            type: integer
          example: 501
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineDevRejectRequest"
      responses:
        "200":
          description: ปฏิเสธ submission สำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineDevCompletionResult"
        "404":
          description: ไม่พบ ticket completion submission นี้
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Submission นี้ถูกยืนยัน ปฏิเสธ หรือถูกแทนที่ด้วยรายการอื่นไปแล้ว
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
