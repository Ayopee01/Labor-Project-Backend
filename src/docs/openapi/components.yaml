        created_at:
          type: string
          format: date-time
          description: เวลาที่สร้างข้อมูลนี้
        updated_at:
          type: string
          format: date-time
          description: เวลาที่แก้ไขข้อมูลนี้ล่าสุด
    DriverJobSnapshotResponse:
      type: object
      description: Response หลักของหน้า Driver Web — รูปเดียวกันทั้ง GET /jobs/current, POST .../ready และทุก event ของ GET /jobs/stream (ในฟิลด์ job)
      properties:
        operation_status:
          $ref: "#/components/schemas/DriverOperationStatus"
        vehicle_job:
          $ref: "#/components/schemas/DriverJobVehicle"
        markets:
          type: array
          description: รายการ Business Ticket (ตลาด) ของงานรถนี้ เรียงลำดับคงที่เหมือน repository
          items:
            $ref: "#/components/schemas/DriverJobMarket"
    DriverStreamEvent:
      type: object
      description: >-
        รูปแบบ event ที่ GET /api/driver/jobs/stream ส่งผ่าน Server-Sent Events แต่ละ event ประกอบด้วย
        SSE frame สองบรรทัด "event: <EventType>" และ "data: <JSON ตาม schema นี้>" คั่นด้วยบรรทัดว่าง
      properties:
        event_id:
          type: string
          description: ใช้ deduplicate event ซ้ำได้ (รูปแบบ "driver_job:<vehicle_job_id>:<unix_ms>")
          example: "driver_job:123:1790127300000"
        event_type:
          type: string
          enum:
            - DRIVER_JOB_SNAPSHOT
            - DRIVER_JOB_UPDATED
            - DRIVER_JOB_TERMINAL
            - DRIVER_SESSION_EXPIRING
            - DRIVER_SESSION_CLOSED
          description: >-
            DRIVER_JOB_SNAPSHOT = ส่งทันทีหลัง subscribe สำเร็จทุกครั้ง (รวม reconnect), DRIVER_JOB_UPDATED =
            สถานะรถ/assignment/ตลาด/แผง/สินค้าเปลี่ยน, DRIVER_JOB_TERMINAL = รถเป็น COMPLETED หรือ CANCELLED,
            DRIVER_SESSION_EXPIRING = session อยู่ใน terminal grace period แล้ว (อ่านต่อได้แต่ mutate ไม่ได้),
            DRIVER_SESSION_CLOSED = server ปิด stream นี้ทันทีหลัง event นี้ เกิดได้ 3 กรณี: (1) terminal grace
            period หมดเวลา (2) session ถูก revoke ทันทีเพราะ device เดิมสแกน QR ซ้ำ (rotate ไปเป็น session ใหม่
            แล้ว) (3) session หมดอายุจริงตามเวลา (ExpiresAt) ระหว่างที่ยังเปิด stream ค้างอยู่
        vehicle_job_id:
          type: integer
          description: id ภายในของ TicketJob (ไม่ใช่ ticket_number)
          example: 123
        occurred_at:
          type: string
          format: date-time
          description: เวลาที่ server สร้าง event นี้
        job:
          allOf:
            - $ref: "#/components/schemas/DriverJobSnapshotResponse"
          nullable: true
          description: มีค่าเฉพาะ DRIVER_JOB_SNAPSHOT/DRIVER_JOB_UPDATED/DRIVER_JOB_TERMINAL เป็น null สำหรับ DRIVER_SESSION_EXPIRING/DRIVER_SESSION_CLOSED
    AdminVehicleJobAssignmentCancelRequest:
      type: object
      required:
        - ticket_number
        - reason_code
      description: Request สำหรับยกเลิกแบบรวมจุดเดียว — ขอบเขตของการยกเลิกจะถูกกำหนดจากว่ามีการส่ง ticket_no/boothCode/worker_code ตัวไหนมาบ้าง (ดูตาราง mapping เต็มๆ ได้ที่ AdminVehicleJobAssignmentCancelResponse) ทุก field ยกเว้น ticket_number กับ reason_code สามารถไม่ส่งมา หรือส่งเป็น null เพื่อหมายถึง "ไม่ได้ระบุ" ได้
      properties:
        ticket_number:
          type: string
          description: เลขอ้างอิงระดับรถ (TicketNumber) 14 หลัก ที่ Gate ออกให้ทั้งคัน
          example: TRUCK-20260723-001
        ticket_no:
          type: string
          nullable: true
          description: Business Ticket ที่เกี่ยวข้อง สังกัดตลาดเดียว
          example: TKT-20260723-000125
        boothCode:
          type: string
          nullable: true
          description: รหัสแผงค้า
          example: OM3/40
        worker_code:
          type: string
          nullable: true
          description: รหัส Worker
          example: MN000115
        reason_code:
          type: string
          description: จำเป็นต้องระบุ ไม่เป็น null บันทึกลง admin_action_logs เป็น string ทุกขอบเขตการยกเลิก
          example: DUPLICATE_TICKET
        reason_text:
          type: string
          nullable: true
          description: ข้อความเหตุผล คู่กับ reason_code
          example: Gate created this ticket twice.
    AdminVehicleJobAssignmentCancelResponse:
      description: "รูปแบบ response ขึ้นอยู่กับขอบเขตที่ resolve ได้จาก request: ticket_number อย่างเดียว -> AdminCancelVehicleJobRequeueResponse (ทั้งงานรถ); + ticket_no -> AdminCancelMarketJobResponse (Business Ticket ใบเดียว); + ticket_no + boothCode -> AdminCancelStallJobResponse (แผงค้าเดียว); + worker_code อย่างเดียว -> AdminCancelAssignmentResponse (assignment ของ Worker คนเดียว ทั้งงานรถ); + ticket_no + worker_code -> AdminCancelTicketWorkerResponse (ถอด Worker คนเดียวออกจาก Business Ticket ใบนั้นใบเดียว); + ticket_no + boothCode + worker_code -> AdminCancelTicketWorkerFromBoothResponse (ถอด Worker คนเดียวออกจากตัวหารค่าแรงของแผงค้านั้นแผงเดียว โดยไม่แตะ TicketWorker.status)"
      oneOf:
        - $ref: "#/components/schemas/AdminCancelVehicleJobRequeueResponse"
        - $ref: "#/components/schemas/AdminCancelMarketJobResponse"
        - $ref: "#/components/schemas/AdminCancelStallJobResponse"
        - $ref: "#/components/schemas/AdminCancelAssignmentResponse"
        - $ref: "#/components/schemas/AdminCancelTicketWorkerFromBoothResponse"
        - $ref: "#/components/schemas/AdminCancelTicketWorkerResponse"
    AdminVehicleOperationStatus:
      type: string
      description: แต่ละงานรถจะอยู่ในสถานะใดสถานะหนึ่งเท่านั้น (ไม่ซ้อนกัน) โดยตัดสินตามลำดับความสำคัญนี้ (สูงสุดก่อน) คือ cancelled, completed, reject (มีแผงค้าใดๆ อยู่ในสถานะ REJECT ที่ยังไม่แก้ไข), wait_unload (dispatchNow=false ไม่ว่าจะตั้งมาจาก Gate ตอนสร้าง หรือถูก Admin ปิดทีหลังก็ตาม), wait_worker (dispatchNow=true แต่จำนวน Worker ที่ active < workers_required — ระบบ FIFO auto-dispatch ยังหาทีมให้ไม่ครบ), ready_now (ทีมครบแล้วและ dispatchNow=true แต่ work_started_at ยังเป็น null — ยังไม่มีใครสแกนเข้างานเลย), working (work_started_at ถูกตั้งค่าแล้ว — ทั้งทีมสแกนเข้างานและกำลังทำงานอยู่ รวมถึงกรณีงานรถที่ถูก release ก่อนกำหนดผ่าน release-workers ด้วย — VehicleJob.status=RELEASED — เพราะงานยังไม่เสร็จจริง แค่รอ Vendor ยืนยัน/timeout เท่านั้น ถ้าต้องการแยกงานที่ release แล้วออกจากงานที่ยังทำอยู่จริง ให้เช็คที่ vehicle_job.status โดยตรง)
      enum:
        - cancelled
        - completed
        - reject
        - wait_unload
