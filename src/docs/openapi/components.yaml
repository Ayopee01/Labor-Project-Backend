    AuthSuccessResponse:
      type: object
      properties:
        access_token:
          type: string
          description: Token สำหรับใช้ยืนยันตัวตนเรียก API ครั้งต่อไป อายุตาม JWT_ACCESS_EXPIRES_IN (ค่าปัจจุบัน 15 นาที) เท่ากันทุก role
          example: access-jwt-token
        refresh_token:
          type: string
          description: >-
            Token สำหรับขอ AccessToken ใหม่ อายุขึ้นกับ role และเป็น absolute cap นับจาก login ครั้งนี้ ไม่ต่ออายุแม้
            POST /api/auth/refresh จะสำเร็จซ้ำหลายครั้งก็ตาม — Worker: 7 วัน (env JWT_REFRESH_EXPIRES_IN_WORKER) /
            Admin: 24 ชั่วโมง (env JWT_REFRESH_EXPIRES_IN_ADMIN) พอถึงกำหนดต้อง login ใหม่เสมอ
          example: refresh-jwt-token
        token_type:
          type: string
          description: ประเภทของ bearer token ค่าคงที่คือ Bearer
          example: Bearer
        expires_in:
          type: integer
          description: อายุของ token หน่วยวินาที
          example: 900
    RefreshSuccessResponse:
      type: object
      properties:
        access_token:
          type: string
          description: Token สำหรับใช้ยืนยันตัวตนเรียก API ครั้งต่อไป อายุตาม JWT_ACCESS_EXPIRES_IN (ค่าปัจจุบัน 15 นาที) เท่ากันทุก role — รีเซ็ตอายุใหม่ทุกครั้งที่ /api/auth/refresh สำเร็จ
          example: access-jwt-token
        refresh_token:
          type: string
          description: >-
            Token ชุดใหม่ (rotate ทุกครั้ง ตัวเก่าใช้ซ้ำไม่ได้อีก) อายุ JWT รีเซ็ตเต็มตาม role อีกครั้ง แต่ไม่ทำให้
            absolute session cap ที่ตั้งไว้ตอน login ครั้งแรกขยับตาม — พอถึงกำหนดจริง (Worker 7 วัน / Admin 24
            ชั่วโมงนับจาก login ครั้งแรก) endpoint นี้จะตอบ 401 บังคับให้ login ใหม่เสมอไม่ว่าจะ refresh ถี่แค่ไหนก็ตาม
          example: refresh-jwt-token
        token_type:
          type: string
          description: ประเภทของ bearer token ค่าคงที่คือ Bearer
          example: Bearer
        expires_in:
          type: integer
          description: อายุของ token หน่วยวินาที
          example: 900
