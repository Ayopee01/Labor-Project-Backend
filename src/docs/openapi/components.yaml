              example: ticket.completion_confirmed
            lang:
              allOf:
                - $ref: "#/components/schemas/AccountLang"
              description: ภาษาปัจจุบันของ Worker ที่ใช้ render เนื้อหานี้ (เหมือนกับ Data[].Lang ด้านบน)
