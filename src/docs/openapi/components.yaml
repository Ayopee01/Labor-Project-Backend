    AdminPermission:
      type: string
      description: mobile_app_versions:create และ mobile_app_versions:update แต่ละตัวต้องมี mobile_app_versions:read อยู่ใน permission set เดียวกันด้วย (ไม่งั้นจะได้ PERMISSION_DEPENDENCY_NOT_SATISFIED) กลุ่ม mobile_app_versions:* ทั้งหมดจะให้สิทธิ์หรือถอนสิทธิ์ได้เฉพาะ admin ระดับ owner เท่านั้น แม้จะเป็น actor ที่มี permissions:update อยู่แล้วก็ตาม (ไม่งั้นจะได้ OWNER_ONLY_PERMISSIONS) — กฎนี้บล็อกเฉพาะ request ที่เปลี่ยนแปลงกลุ่มนี้จริงๆ เท่านั้น ถ้าส่งชุด mobile_app_versions:* เดิมของ target ซ้ำโดยไม่เปลี่ยนแปลงจะอนุญาตให้ทำได้
      enum:
        - settings:read
        - settings:update
        - roles:read
        - admins:create
        - admins:update
        - admins:reset_password
        - gate_clients:read
        - gate_clients:create
        - gate_clients:update
        - gate_clients:rotate_secret
        - permissions:read
        - permissions:update
        - workers:read
        - workers:create
        - workers:update
        - workers:reset_password
        - workers:force_status
        - jobs:read
        - jobs:assign
        - jobs:cancel
        - jobs:extend_deadline
        - jobs:override_count
        - jobs:wait
        - jobs:release_workers
        - mobile_app_versions:read
        - mobile_app_versions:create
        - mobile_app_versions:update
