        WorkerCount:
          type: integer
          example: 3
          description: จำนวน Worker ที่ต้องการตาม master data ของสินค้านี้ ไม่ใช่ตัวหารทางการเงิน

    GateTicketResponseBooth:
      type: object
      required:
        - BoothCode
        - BoothName
        - Products
