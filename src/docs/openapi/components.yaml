          example: Chrome on Windows
        fcm_token:
          type: string
          description: ไม่บังคับสำหรับ Worker login คือ FCM registration token จาก Firebase SDK บนมือถือ ใช้สำหรับ push notification ตอนแอปอยู่เบื้องหลัง รับ key แบบ PascalCase FcmToken ได้ด้วย ถ้าตอน login ยังไม่มีค่านี้ ให้เรียก POST /api/auth/push-token หลัง login สำเร็จ
          example: fcm-registration-token
        platform:
          type: string
          description: แพลตฟอร์มของ push token (ไม่บังคับ) รับ key แบบ PascalCase Platform ได้ด้วย ค่าเริ่มต้นเป็น unknown ถ้าไม่ส่งมา
          enum:
