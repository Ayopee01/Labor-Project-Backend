    DriverJobVehicle:
      type: object
      description: ข้อมูลงานรถแบบเต็มสำหรับหน้ารายละเอียด Driver (ไม่มี field ระดับ Admin หรือข้อมูลส่วนตัวของ Worker)
      properties:
        ticket_number:
          type: string
          description: เลขอ้างอิงระดับรถ (TicketNumber) 14 หลัก ที่ Gate ออกให้ทั้งคัน
          example: TRUCK-20260723-001
        license_plate:
