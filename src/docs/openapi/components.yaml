              description: เลขอ้างอิงระดับรถ (TicketNumber) 14 หลัก ที่ Gate ออกให้ทั้งคัน
              example: TRUCK-20260723-001
            license_plate:
              type: string
              description: ทะเบียนรถ
              example: ABC-1234
            license_plate_province:
              type: string
              nullable: true
              description: จังหวัดของป้ายทะเบียน
              example: Bangkok
            vehicle_type:
              type: string
              nullable: true
              description: ประเภทรถ
              example: Six-wheel truck
            status:
              type: string
              description: สถานะปัจจุบันของข้อมูลนี้
              example: COMPLETED
          description: ข้อมูลงานรถ
        financial_status:
          type: string
          enum:
            - PENDING
            - PARTIAL
            - FINALIZED
          description: สถานะการคำนวณการเงิน
          example: FINALIZED
        summary:
          type: object
          properties:
            booth_count:
              type: integer
              description: จำนวนแผงค้า
              example: 1
            financialized_booth_count:
              type: integer
              description: จำนวนแผงที่คำนวณการเงินเสร็จแล้ว
              example: 1
            final_stall_amount:
              type: string
              description: ยอดค่าแผงสรุปสุดท้าย
              example: "34.00"
            labor_fee_raw:
              type: string
              description: ค่าแรงดิบก่อนปัดเศษ
              example: "12.6000"
            worker_payout_total:
              type: string
              description: ยอดจ่ายให้ Worker รวม
              example: "12.00"
            fund_amount:
              type: string
              description: ยอดเข้ากองทุน
              example: "0.6000"
          description: สรุปภาพรวม
        booths:
          type: array
          items:
            $ref: "#/components/schemas/AdminFinancialBooth"
          description: รายการแผงค้า

    AdminVehicleJobListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminVehicleJobHistoryItemResponse"
          description: รายการข้อมูลที่ตรงกับเงื่อนไข
        available_dropoff_points:
          type: array
          items:
            type: string
          example: ["Dock A1", "Dock B2"]
          description: รายการ dropoff_point ที่มีอยู่จริงทั้งหมดภายใต้ตัวกรอง date_from/date_to, search และ status ปัจจุบัน (ไม่รวมผลของ dropoff_point เอง) เป็นลิสต์เต็มเสมอไม่ขึ้นกับ page/limit ใช้สร้าง dropdown ได้ตรงๆ โดยไม่ต้องเรียก API แยก เลือกค่าจากที่นี่แล้วส่งกลับเป็น query param dropoff_point เพื่อกรอง
        pagination:
          nullable: true
          type: object
          properties:
            page:
              type: integer
              description: เลขหน้า
            limit:
              type: integer
              description: จำนวนรายการต่อหน้า
            total:
              type: integer
              description: จำนวนรายการทั้งหมดที่ตรงเงื่อนไข ไม่ขึ้นกับ page/limit
            total_pages:
              type: integer
              description: จำนวนหน้าทั้งหมด
          description: ข้อมูล pagination

    AdminHistoryRejection:
      type: object
      description: การปฏิเสธหนึ่งรายการของการส่งยอดแผงค้า ไม่ว่าจะแก้ไขแล้วหรือยังรอดำเนินการ คำนวณมาจากแถว TicketCompletionSubmission เรียงตามลำดับที่ส่งเข้ามา
      properties:
        rejectedAt:
          type: string
          format: date-time
          description: เวลาที่ถูกปฏิเสธ
        correction_owner:
          type: string
          nullable: true
          description: เจ้าของแผง (Master Owner) ปัจจุบัน (อ้างอิงจาก MasterOwnerStall ตาม marketCode+boothCode) ไม่ใช่ภาพนิ่ง ณ ตอนที่ถูกปฏิเสธ
        correction_owner_type:
          type: string
          enum:
            - worker
            - admin
          description: ผู้ที่ควรเป็นคนแก้ไขรายการที่ถูกปฏิเสธนี้ ตัดสินจากสถานะปัจจุบันของงานรถ (ไม่ใช่ภาพนิ่ง ณ ตอนที่ถูกปฏิเสธ เหมือน correction_owner) — เป็น "worker" ตราบใดที่งานรถยังไม่ถูกปล่อย (ทีมยังอยู่หน้างาน ส่งยอดใหม่เองได้) และเป็น "admin" เมื่องานรถถูกปล่อยแล้ว (ทีมกลับเข้าคิวแล้ว ต้องให้ Admin จัดการแทน)
        rejected_by_type:
          type: string
          nullable: true
          enum:
            - owner
            - member
          description: คำนวณจาก TicketCompletionSubmission.resolved_by_line_user_id เทียบกับ MasterOwnerStall แล้ว MasterMemberStall เป็น null ถ้าการปฏิเสธเกิดจากหมดเวลารอจนยืนยันอัตโนมัติ (ไม่มี LINE user) หรือระบุตัวตนไม่ได้
        rejected_by_name:
          type: string
          nullable: true
          description: ชื่อ Vendor ที่ปฏิเสธรายการนี้

    AdminHistoryProduct:
      description: field เดียวกับ AdminFinancialProduct ยกเว้น ticket_product_id (เป็น PK ภายในที่หน้าจอ override ของ /financials ต้องใช้ แต่ Work History ซึ่งเป็นแบบอ่านอย่างเดียวไม่จำเป็นต้องใช้)
      type: object
      properties:
        productCode:
          type: string
          description: รหัสสินค้า
          example: "02020300"
        productFullCode:
          type: string
          nullable: true
          description: รหัสสินค้าแบบเต็ม
          example: "02020300000000000000"
        productName:
          type: string
          description: ชื่อสินค้า
          example: Rambutan
        packageCode:
          type: string
          description: รหัส Package
          example: "29"
        packageName:
          type: string
          description: ชื่อ Package
          example: Crate 20
        quantity:
          type: string
          description: จำนวน
          example: "10.00"
        confirmed_quantity:
          type: string
          nullable: true
          description: จำนวนที่ Worker/Vendor ยืนยันแล้ว
          example: "10.00"
        rate_snapshot:
          $ref: "#/components/schemas/AdminFinancialRateSnapshot"
        financial:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AdminProductFinancial"
          description: ผลการคำนวณการเงินของรายการนี้
        workers:
          type: array
          items:
            $ref: "#/components/schemas/AdminFinancialWorkerPayment"
          description: รายชื่อ Worker

    AdminHistoryBooth:
      description: แผงค้า (BoothJob) ภายใน Business Ticket ของ Work History ใช้ field การเงินที่บันทึกไว้ชุดเดียวกับ AdminFinancialBooth (ไม่คำนวณใหม่) รวมถึงการติดตามการส่งยอด/การปฏิเสธที่ endpoint /financials ไม่จำเป็นต้องใช้ — ไม่มี ticket_id/ticket_no/marketCode/marketName เพราะมีอยู่แล้วในระดับบนสุดที่ AdminHistoryMarket
      type: object
      properties:
        boothCode:
          type: string
          description: รหัสแผงค้า
          example: OM3/40
        boothName:
          type: string
          nullable: true
          description: ชื่อแผงค้า
          example: Vendor A
        status:
          type: string
          description: สถานะปัจจุบันของข้อมูลนี้
          example: COMPLETED
        cancellation:
          allOf:
            - $ref: "#/components/schemas/AdminHistoryCancellation"
          description: มีค่าเมื่อสถานะแผงนี้เป็น CANCELLED ถ้าแผงนี้ไม่มี log STALL_JOB_CANCELLED ของตัวเอง (ถูกยกเลิกทางอ้อมจากการยกเลิกทั้งตลาดหรือทั้งงานรถ) จะ fallback ไปใช้ log การยกเลิกของตลาดหรืองานรถนั้นแทน
        financialized:
          type: boolean
          description: true เมื่อคำนวณการเงินของรายการนี้เสร็จแล้ว
          example: true
        final_stall_amount:
          type: string
          nullable: true
          description: ยอดค่าแผงสรุปสุดท้าย
          example: "34.00"
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: เวลาที่เสร็จสมบูรณ์ เป็น null จนกว่าจะเสร็จ
        summary:
          type: object
          properties:
            labor_fee_raw:
              type: string
              description: ค่าแรงดิบก่อนปัดเศษ
              example: "12.6000"
            worker_payout_total:
              type: string
              description: ยอดจ่ายให้ Worker รวม
              example: "12.00"
            fund_amount:
              type: string
              description: ยอดเข้ากองทุน
              example: "0.6000"
          description: สรุปภาพรวม
        workers:
          type: array
          items:
            $ref: "#/components/schemas/AdminFinancialBoothWorker"
          description: รายชื่อ Worker
        products:
          type: array
          items:
            $ref: "#/components/schemas/AdminHistoryProduct"
          description: รายการสินค้า
        vendor_line_id:
          type: string
          nullable: true
          description: รหัสผู้ใช้ LINE (LINE user id) ของ Vendor ที่แผงนี้
        submitted_by_codes:
          type: array
          items:
            type: string
          description: รหัสบัญชี (Worker หรือ Admin ที่ส่งแทน) ที่เคยส่งยอดของแผงนี้ ไม่ซ้ำกัน
        submitted_by_role:
          type: string
          nullable: true
          enum:
            - worker
            - admin
          description: บทบาทของบัญชีที่ส่งยอดล่าสุดของแผงนี้
        latest_submitted_by_code:
          type: string
          nullable: true
          description: รหัสบัญชีของคนที่ส่งยอดล่าสุดของแผงนี้ ต่างจาก submitted_by_codes ซึ่งเป็นชุดคนที่เคยส่งทั้งหมดโดยไม่ระบุว่าใครส่งล่าสุด
        latest_submitted_by_name:
          type: string
          nullable: true
          description: ชื่อของคนที่ส่งยอดล่าสุดของแผงนี้
        submission_worker_snapshot:
          type: array
          description: รายชื่อ Worker ที่ยังอยู่สถานะ WORKING ณ ตอนที่สร้างการส่งยอดล่าสุด (SubmissionWorkerSnapshot) ต่างจากรายชื่อตอน Vendor ยืนยัน (Confirm-time) ถ้าทีมเปลี่ยนระหว่าง Worker ส่งยอดกับ Vendor ยืนยัน สองชุดนี้จะไม่เท่ากัน เป็น array ว่างถ้ายังไม่เคยส่งยอด
          items:
            type: object
            properties:
              worker_code:
                type: string
                nullable: true
                description: รหัส Worker
                example: W000012
              full_name:
                type: string
                description: ชื่อ-นามสกุล
                example: Somchai Jaidee
        submitted_at:
          type: string
          format: date-time
          nullable: true
          description: เวลาที่ส่งยอดล่าสุด
        confirmedAt:
          type: string
          format: date-time
          nullable: true
          description: เวลาที่ Vendor ยืนยันยอดล่าสุด มีค่าเสมอเมื่อสรุปผลแล้ว ไม่ว่าจะยืนยันเองหรือหมดเวลารอจน BullMQ ยืนยันอัตโนมัติ
        confirmed_by_type:
          type: string
          nullable: true
          enum:
            - vendor
            - timeout
          description: วิธีที่การส่งยอดล่าสุดถูกสรุปผล — "vendor" เมื่อยืนยันเองผ่าน LINE, "timeout" เมื่อ BullMQ ยืนยันอัตโนมัติเมื่อหมดเวลา เป็น null ถ้ายังไม่เคยยืนยัน
        rejection_history:
          type: array
          items:
            $ref: "#/components/schemas/AdminHistoryRejection"
          description: ประวัติการถูกปฏิเสธยอดของแผงนี้
        company_share_rate:
          type: string
          description: อัตราส่วนแบ่งบริษัท คำนวณจาก (fund_amount / labor_fee_raw) * 100 จากผลการคำนวณการเงินชุดเดียวกันที่ finalize แล้ว เป็น "0.00" ถ้า labor_fee_raw เป็น 0
          example: "4.76"
        worker_count:
          type: integer
          nullable: true
          description: จำนวนแถว TicketWorker ที่มีสถานะ WORKING ณ ตอนสร้างการส่งยอดล่าสุด (TicketCompletionSubmission.worker_count_snapshot) ต่างจากรายชื่อปัจจุบัน, จาก WorkerSnapshot (ตอน Confirm) และจาก Financial worker_count เป็น null ถ้ายังไม่เคยส่งยอด หรือการส่งยอดล่าสุดเกิดก่อนมี feature นี้ (ไม่ fallback ไปนับรายชื่อปัจจุบัน)
          example: 3

    AdminHistoryMarket:
      type: object
      description: Business Ticket (MarketJob) หนึ่งใบภายในงานรถของ Work History โดยแผงค้าของ Ticket นี้จะอยู่ในรูปแบบ AdminHistoryBooth
      properties:
        ticket_no:
          type: string
          description: Business Ticket ที่เกี่ยวข้อง สังกัดตลาดเดียว
          example: TKT-20260723-000125
        marketCode:
          type: string
          description: รหัสตลาด
          example: "1123"
        marketName:
          type: string
          description: ชื่อตลาด
          example: Market A
        dropoff_point:
          type: string
          nullable: true
          description: จุดที่สินค้าของ Ticket นี้ถูกขนลง
        status:
          type: string
          description: สถานะปัจจุบันของข้อมูลนี้
          example: COMPLETED
        cancellation:
          allOf:
            - $ref: "#/components/schemas/AdminHistoryCancellation"
          description: มีค่าเมื่อสถานะตลาดนี้เป็น CANCELLED ถ้าตลาดนี้ไม่มี log MARKET_JOB_CANCELLED ของตัวเอง (ถูกยกเลิกทางอ้อมจากการยกเลิกทั้งงานรถ) จะ fallback ไปใช้ log การยกเลิกของงานรถแทน
        booths:
          type: array
          items:
            $ref: "#/components/schemas/AdminHistoryBooth"
          description: รายการแผงค้า

    AdminHistoryCancellation:
      type: object
      nullable: true
      description: รายละเอียดการยกเลิก ใช้ร่วมกันทั้งระดับ VehicleJob, MarketJob, BoothJob/Booth และระดับ Worker แต่ละคน เป็น null ถ้าสถานะระดับนั้นไม่ใช่ CANCELLED ถ้าสถานะเป็น CANCELLED แต่หา AdminActionLog ที่ตรงกันไม่เจอ sub-field ต่างๆ จะเป็น null แทนที่จะเดาค่าขึ้นมา
      properties:
        cancelled_at:
          type: string
          format: date-time
          nullable: true
          description: เวลาที่ยกเลิก
        reason_code:
          type: string
          nullable: true
          description: >-
            รหัสเหตุผล คู่กับ reason_text — ระดับ Worker มีค่าพิเศษ vehicle_job_closed_before_scan เมื่อรถปิดงาน
            (ทุกแผงจบ) ก่อน Worker คนนั้น Scan เข้างาน เช่น Admin เพิ่มเข้ามาแทนแต่ทีมเดิมส่งยอดจนจบก่อน — ไม่ได้ทำงานจริงและไม่ได้ค่าแรง
        reason_text:
          type: string
          nullable: true
          description: ข้อความเหตุผล คู่กับ reason_code
        cancelled_by_type:
          type: string
          nullable: true
          description: บทบาทของ Admin ที่ยกเลิก (AdminActionLog.actor_role) หรือ system เมื่อระบบปิดให้เอง (vehicle_job_closed_before_scan)
        cancelled_by_name:
          type: string
          nullable: true
          description: ชื่อ Admin ที่ยกเลิก

    AdminHistoryWorker:
      type: object
      description: Worker หนึ่งคนที่กดรับงานจริง (TicketJobAssignment.accepted_at ไม่เป็น null) สำหรับงานรถนี้ ตัดรายการซ้ำด้วย worker_account_id — ถ้า Worker คนเดียวกันถูก dispatch/กดรับมากกว่า 1 ครั้ง จะเลือก assignment ที่มี accepted_at ล่าสุด Worker ที่ถูก dispatch แต่ไม่เคยกดรับจะไม่แสดงในนี้ แต่ยังปรากฏใน timeline
      properties:
        worker_account_id:
          type: integer
          description: รหัสอ้างอิงคงที่สำหรับ join กับ finance.workers[] และรายงานอื่น ห้าม join ด้วยชื่อหรือหมายเลขเสื้อ
        assignment_id:
          type: integer
          description: TicketJobAssignment ที่ถูกเลือกให้เป็นตัวแทนของแถว Worker คนนี้
        worker_code:
          type: string
          nullable: true
          description: รหัส Worker
          example: MN000115
        full_name:
          type: string
          description: ชื่อ-นามสกุล
          example: Worker Name
        shirt_number:
          type: string
          nullable: true
          description: หมายเลขเสื้อของ Worker
          example: "4"
        accepted_at:
          type: string
          format: date-time
          nullable: true
          description: เวลาที่ Worker กดรับงาน เป็น null จนกว่าจะรับ
        scanned_at:
          type: string
          format: date-time
          nullable: true
          description: เวลาที่ Worker สแกนเข้างาน เป็น null จนกว่าจะสแกน
        started_at:
          type: string
          format: date-time
          nullable: true
          description: ถือว่า Worker เริ่มงานทันทีที่กดรับ assignment ค่านี้จึงเท่ากับ accepted_at
        submitted_at:
          type: string
          format: date-time
          nullable: true
          description: เวลาส่งยอดล่าสุดที่ผูกกับ assignment ที่เลือก (TicketCompletionSubmission.assignment_id) ไม่ใช่การส่งยอดอื่นของ Worker คนนี้ในงานอื่น เป็น null ถ้าไม่สามารถระบุการส่งยอดของรอบทำงานนี้ได้แน่ชัด
        released_at:
          type: string
          format: date-time
          nullable: true
          description: เวลาที่ Worker คนนี้ถูกปล่อยกลับคิว
        final_status:
          type: string
          description: สถานะสุดท้ายของ Worker ในงานนี้
          example: COMPLETED
        cancellation:
          $ref: "#/components/schemas/AdminHistoryCancellation"

    AdminHistoryTimelineItem:
      type: object
      description: เหตุการณ์หนึ่งรายการบน timeline ตามลำดับเวลาของงานรถ รวมมาจาก WorkerAssignmentEvent, TicketCompletionSubmission และ AdminActionLog แล้วเรียงตาม occurred_at รายการ COUNT_SUBMITTED จะมี actor_type เป็น "admin" (แทนที่จะเป็น "worker") เมื่อการส่งยอดนั้นมาจาก POST .../override-count แทนที่จะมาจาก flow submit-count ของ Worker เอง
