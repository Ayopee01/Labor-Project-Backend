          $ref: "#/components/schemas/AdminAuditEventsSummary"
    WorkerStatusResponse:
      type: object
      properties:
        full_name:
          type: string
          description: ชื่อ-นามสกุล
          example: Worker Name
        worker_code:
          type: string
          nullable: true
          description: รหัส Worker
          example: MN000142
        image_url:
          type: string
          nullable: true
          description: URL รูปโปรไฟล์
          example: https://example.com/uploads/workers/mn000142.jpg
        status:
          type: string
          description: สถานะของ Worker บน UI ค่าคิวภายในจะถูกแปลงเป็น open_app, ready, assigned, waiting_team, working หรือ break
          enum:
            - open_app
            - ready
            - assigned
            - waiting_team
            - working
            - break
          example: break
        today_job_count:
          type: integer
          description: จำนวนงานวันนี้
          example: 3
        break_count_used:
          type: integer
          description: จำนวนครั้งที่ Worker พักไปแล้ว
          example: 1
        break_count_limit:
          type: integer
          description: จำนวนครั้งสูงสุดที่ Worker พักได้ (ค่ามาจาก runtime setting worker_break_limit ที่ Admin ปรับได้)
          example: 3
        break_duration_minutes:
          type: integer
          description: ระยะเวลาพักต่อครั้ง หน่วยนาที (ค่ามาจาก runtime setting worker_break_duration_minutes ที่ Admin ปรับได้)
          example: 15
        completed_job_count:
          type: integer
          description: จำนวนงานที่ทำเสร็จแล้ว
          example: 2
        nationality:
          type: string
          nullable: true
          enum:
            - Myanmar
            - Cambodia
          description: สัญชาติของ Worker
          example: Myanmar
        work_start_date:
          type: string
          nullable: true
          format: date
          description: วันที่เริ่มงานของ Worker
          example: 2024-07-15
        phone:
          type: string
          nullable: true
          description: เบอร์โทรศัพท์
          example: 081-234-5678
        shift:
          $ref: "#/components/schemas/ProfileCardShift"
        shift_active:
          type: boolean
          description: "true เมื่อเข้าเงื่อนไขครบทั้ง 2 ข้อ: (1) อยู่ในช่วงเวลากะจริง (เงื่อนไขเดียวกับที่ POST /api/workers/me/online เช็กก่อนโยน 403 OUTSIDE_WORK_SHIFT) และ (2) ยังไม่เคยปิดกะนี้ไปก่อน (ตาม WorkerCheckinLog) ถ้า Worker ปิดกะไปแล้วจะเป็น false ทันทีแม้ยังอยู่ในช่วงเวลากะ ใช้เปิด/ปิดปุ่ม Online บนแอปได้โดยไม่ต้องคำนวณเงื่อนไขเอง"
          example: true
        reason_code:
          type: string
          enum:
            - OUTSIDE_SHIFT
            - SHIFT_ALREADY_CLOSED
            - ACCEPT_TIMEOUT_LIMIT_REACHED
            - SCAN_TIMEOUT
            - ADMIN_CANCELLED_ASSIGNMENT
            - ADMIN_FORCED_STATUS
            - BREAK_RETRY_EXPIRED
          description: "มีเฉพาะตอน shift_active เป็น false บอกเหตุผล: OUTSIDE_SHIFT = ไม่มีกะวันนี้ หรือนาฬิกายังไม่ถึง/เลยเวลากะจริงๆ (ยังไม่เคย Go Online กะนี้เลย ไม่ต้องรอ Admin แค่รอถึงเวลากะ), SHIFT_ALREADY_CLOSED = เคย Go Online กะนี้แล้วแต่ออกจากกะไปแล้วแม้นาฬิกายังอยู่ในเวลากะ (เลิกงาน/logout เอง, หมดเวลากะ, หรือ Admin ปิดบัญชี/reset รหัสผ่านให้) ต้องรอ Admin, ACCEPT_TIMEOUT_LIMIT_REACHED = ไม่กดรับงานติดต่อกันครบจำนวนที่ตั้งค่าไว้ ระบบปิดกะให้ ต้องรอ Admin, SCAN_TIMEOUT = สแกน QR/บาร์โค้ดไม่ทันเวลาที่กำหนด ต้องรอ Admin, ADMIN_CANCELLED_ASSIGNMENT = Admin ยกเลิกงานที่กำลังทำอยู่ ต้องรอ Admin, ADMIN_FORCED_STATUS = Admin สั่งเปลี่ยนสถานะเป็น open_app โดยตรง ต้องรอ Admin, BREAK_RETRY_EXPIRED = หมดเวลาพักและไม่เปิดแอปกลับมาภายในเวลาที่กำหนด ต้องรอ Admin ช่วงที่เพิ่งหมดเวลาพักแต่ยังอยู่ในหน้าต่างเวลาที่เปิดแอปกลับเข้าคิวเองได้ (ก่อนจะกลายเป็น BREAK_RETRY_EXPIRED) จะไม่มี reason_code ให้ เพราะ FCM แจ้งไปแล้วและยัง self-resolve ได้เอง เช่นเดียวกับกรณีอื่นที่ระบบยังไม่รู้จัก reason field นี้จะไม่มีค่า"
          example: OUTSIDE_SHIFT
        reason_text:
          type: string
          description: ข้อความอธิบาย reason_code แปลตามภาษาของ Worker (lang) มีเฉพาะเมื่อมี reason_code บางโค้ด (ACCEPT_TIMEOUT_LIMIT_REACHED, BREAK_RETRY_EXPIRED) มีตัวเลขจาก runtime settings แทรกอยู่ในข้อความด้วย
          example: ขณะนี้ท่านอยู่นอกช่วงเวลาปฏิบัติงานตามกะที่กำหนด
        current_job:
          allOf:
            - $ref: "#/components/schemas/WorkerCurrentJob"
          nullable: true
          description: มีเฉพาะตอนสถานะเป็น assigned, waiting_team, working เท่านั้น (ไม่มีตอน open_app, ready, break)
        break_until:
          type: string
          format: date-time
          description: มีค่าเฉพาะตอนสถานะเป็น break
          example: 2026-07-14T05:30:00.000Z
        break_until_unix_ms:
          type: integer
          format: int64
          nullable: true
          description: เวลาเดียวกับ break_until แต่เป็น Unix timestamp หน่วยมิลลิวินาที มีค่าเฉพาะตอนสถานะเป็น break
          example: 1784007000000
        remaining_break_time:
          type: object
          description: มีค่าเฉพาะตอนสถานะเป็น break
          properties:
            total_seconds:
              type: integer
              description: เวลาที่เหลือรวม หน่วยวินาที
              example: 420
            minutes:
              type: integer
              description: ระยะเวลา หน่วยนาที
              example: 7
            seconds:
              type: integer
              description: ระยะเวลา หน่วยวินาที
              example: 0
            text:
              type: string
              description: ข้อความ
              example: 7 minutes
    AdminWorkerStatusResponse:
      type: object
      properties:
        full_name:
          type: string
          description: ชื่อ-นามสกุล
          example: MANY MANY
        worker_code:
          type: string
          nullable: true
          description: รหัส Worker
          example: MN000115
        shirt_number:
          type: string
          nullable: true
          description: หมายเลขเสื้อของ Worker
          example: "115"
        image_url:
          type: string
          nullable: true
          description: URL รูปโปรไฟล์
          example: https://example.com/uploads/workers/mn000115.jpg
        shift_name:
          type: string
          nullable: true
          description: ชื่อกะตามค่าใน master DB (LaborMaster.TimeWork) backend ไม่คำนวณเอง
          example: Morning
        latest_activity_at:
          type: string
          nullable: true
          format: date-time
          description: เวลากิจกรรมล่าสุดของ Worker เช่น heartbeat จากแอป, เวลาเข้าคิว, เวลารับ/สแกนงาน หรืออัปเดตสถานะล่าสุด
          example: 2026-07-12T14:40:07.759Z
        status_entered_at:
          type: string
          nullable: true
          format: date-time
          description: เวลาที่ใช้เรียงลำดับ Worker ในคอลัมน์สถานะปัจจุบัน open_app ใช้เวลาอัปเดตสถานะหรือ heartbeat, ready ใช้เวลาเข้าคิว, assigned ใช้เวลารับ/ได้รับมอบหมายงาน, working ใช้เวลาสแกน/เริ่มงาน, break ใช้เวลาเริ่มพัก
          example: 2026-07-12T14:35:00.000Z
        queue_position:
          type: integer
          nullable: true
          description: ลำดับในคิว Redis (เริ่มที่ 1) มีค่าเฉพาะ Worker สถานะ ready
          example: 1
        socket_connected:
          type: boolean
          description: true เมื่อ Worker กำลังเชื่อมต่อ WebSocket อยู่ Worker สถานะ ready หรือ assigned อาจยังแสดงเป็น false ได้หลังหลุดการเชื่อมต่อ
          example: false
        status:
          type: string
          description: สถานะเดียวที่ API นี้คืนค่า UI จะแมปค่านี้ไปยังคอลัมน์บนบอร์ด
          enum:
            - open_app
            - ready
            - assigned
            - waiting_team
            - working
            - break
          example: ready
        is_overtime:
          type: boolean
          description: true เมื่อกะของ Worker หมดเวลาไปแล้วแต่ยังมี assignment ค้างอยู่ ระบบยังคงแสดง Worker คนนี้ในลิสต์ (ข้ามการกรองตามกะปกติ) เพื่อให้ Admin จัดการเองได้ โดย backend จะไม่รีเซ็ตสถานะให้อัตโนมัติในกรณีนี้
          example: false
        assignment:
          type: object
          nullable: true
          description: assignment ปัจจุบันของ Worker เป็น null ถ้าไม่มี assignment ที่ยัง active
          properties:
            ticket_number:
              type: string
              nullable: true
              description: TicketNumber (14 หลัก) ของงานรถที่ assignment นี้สังกัด
              example: "12345678901234"
            status:
              type: string
              description: สถานะ assignment ดิบตามที่ backend เก็บไว้ ไม่ได้ normalize
              enum:
                - PENDING
                - ACCEPTED
                - SCANNED
                - WORKING
                - DELIVERED
                - REJECT
                - COMPLETED
                - RELEASED
                - CANCELLED
                - TIMEOUT
              example: PENDING
            created_at:
              type: string
              format: date-time
              description: เวลาที่สร้างข้อมูลนี้
              example: 2026-07-12T14:30:00.000Z
            accepted_at:
              type: string
              nullable: true
              format: date-time
              description: เวลาที่ Worker กดรับงานจริง (เปลี่ยนจาก PENDING เป็น ACCEPTED) เป็น null ถ้ายังไม่กดรับ
              example: null
            accept_deadline_at:
              type: string
              nullable: true
              format: date-time
              description: เวลาสิ้นสุดที่ Worker ต้องกดรับก่อนหมดเวลา เป็น null ถ้า assignment ไม่ได้อยู่สถานะ PENDING
              example: 2026-07-12T14:32:00.000Z
            accept_deadline_unix_ms:
              type: integer
              nullable: true
              description: deadline เดียวกับ accept_deadline_at แต่เป็น Unix timestamp หน่วยมิลลิวินาที สำหรับตัวนับถอยหลัง
              example: 1752330720000
            scan_deadline_at:
              type: string
              nullable: true
              format: date-time
              description: เวลาสิ้นสุดที่ Worker ต้องสแกน QR เช็คอิน
              example: null
        reason_code:
          type: string
          enum:
            - SHIFT_ALREADY_CLOSED
            - ACCEPT_TIMEOUT_LIMIT_REACHED
            - SCAN_TIMEOUT
            - ADMIN_CANCELLED_ASSIGNMENT
            - ADMIN_FORCED_STATUS
            - BREAK_RETRY_EXPIRED
          description: มีเฉพาะตอน status เป็น open_app เท่านั้น (backend บังคับไว้ ไม่ให้ field นี้หลุดไปติด status อื่น เช่น working/assigned ตอน worker ทำ overtime) และมีสาเหตุที่ต้อง Admin ช่วย force กลับเข้าคิว (ความหมายเดียวกับ reason_code ใน GET /api/workers/me/status ยกเว้น OUTSIDE_SHIFT ที่ไม่มีทางเกิดใน list นี้ เพราะ worker ที่นาฬิกาอยู่นอกเวลากะจริงๆ ถูกกรองออกจาก list ไปตั้งแต่แรกแล้ว) worker ที่มี field นี้จะยังคงอยู่ใน list แม้ offline และไม่มีงานค้าง เพื่อให้ Admin หาเจอตอน worker มาติดต่อขอให้ force เข้าคิว
          example: SCAN_TIMEOUT
        reason_text:
          type: string
          description: ข้อความอธิบาย reason_code เป็นภาษาไทยเสมอ (ไม่อิง worker.lang ต่างจาก reason_text ใน GET /api/workers/me/status เพราะ Admin dashboard เป็นภาษาไทยล้วน) มีเฉพาะเมื่อมี reason_code
          example: ท่านสแกน QR โค้ด/บาร์โค้ดไม่ทันเวลาที่กำหนด กรุณาติดต่อเจ้าหน้าที่ (Admin)
    AdminWorkerStatusListResponse:
      type: object
      properties:
        summary:
          type: object
          properties:
            total:
              type: integer
              description: จำนวนรายการทั้งหมดที่ตรงเงื่อนไข ไม่ขึ้นกับ page/limit
            open_app:
              type: integer
              description: จำนวน Worker สถานะ open_app
            ready:
              type: integer
              description: จำนวน Worker ที่พร้อมทำงาน
            assigned:
              type: integer
              description: จำนวน Worker ที่ถูก assign อยู่
            waiting_team:
              type: integer
              description: จำนวน Worker ที่รอทีมสแกนให้ครบ
            working:
              type: integer
              description: จำนวน Worker ที่กำลังทำงานอยู่
            break:
              type: integer
              description: จำนวน Worker ที่กำลังพักอยู่
          description: สรุปภาพรวม
        pagination:
          allOf:
            - $ref: "#/components/schemas/PaginationMeta"
          description: มีค่าเฉพาะตอนส่ง page หรือ limit มาใน query
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminWorkerStatusResponse"
          description: รายการข้อมูลที่ตรงกับเงื่อนไข
    AdminForceWorkerStatusRequest:
      type: object
      required:
        - status
        - reason_code
      properties:
        status:
          type: string
          enum:
            - open_app
            - ready
            - break
          description: สถานะปัจจุบันของข้อมูลนี้
          example: open_app
        reason_code:
          type: string
          description: รหัสเหตุผล คู่กับ reason_text
          example: IDLE_TOO_LONG
        reason_text:
          type: string
          nullable: true
          description: ข้อความเหตุผล คู่กับ reason_code
          example: Worker contacted admin for status correction.
    AdminForceWorkerStatusResponse:
      type: object
      properties:
        Message:
          type: string
          description: ข้อความผลลัพธ์
          example: Worker status forced successfully.
        FullName:
          type: string
          description: ชื่อ-นามสกุล
          example: MANY MANY
        WorkerCode:
          type: string
          nullable: true
          description: รหัส Worker
          example: MN000115
        Status:
          type: string
          enum:
            - open_app
            - ready
            - assigned
            - waiting_team
            - working
            - break
          description: สถานะปัจจุบันของข้อมูลนี้
          example: open_app
