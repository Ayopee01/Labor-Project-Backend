          type: string
          description: รหัสแผงค้า
          example: OM3/40

        BoothName:
          type: string
          nullable: true
          description: ชื่อแผงค้า
          example: Vendor A

        Products:
          type: array
          items:
            $ref: "#/components/schemas/GateTicketResponseProduct"
          description: รายการสินค้า

    GateTicketResponse:
      type: object
      required:
        - Result
        - TicketNumber
        - Ticket
        - Market
        - Booths
        - WorkerCount
        - Qr

      properties:
        Result:
          type: string
          enum:
            - CREATED
            - REPLAYED
          description: ผลลัพธ์ของการทำรายการ
          example: CREATED

        TicketNumber:
          type: string
          example: TRUCK-20260804-001
          description: เลขอ้างอิงระดับรถ ส่งค่ากลับตามที่ระบุใน request

        Ticket:
          type: object
          required:
            - TicketNo
            - TicketCreatedAt
            - BoothCount
            - LicensePlate
            - LicensePlateProvince
            - VehicleTypeCode
            - VehicleTypeName
            - Status
          properties:
            TicketNo:
              type: string
              description: Business Ticket ที่เกี่ยวข้อง สังกัดตลาดเดียว
              example: TKT-20260804-000001

            TicketCreatedAt:
              type: string
              format: date-time
              description: เวลาที่ Gate สร้าง Ticket นี้
              example: "2026-08-04T07:30:00.000Z"

            BoothCount:
              type: integer
              description: จำนวนแผงค้า
              example: 2

            LicensePlate:
              type: string
              description: ทะเบียนรถ
              example: ABC-1234

            LicensePlateProvince:
              type: string
              nullable: true
              description: จังหวัดของป้ายทะเบียน
              example: Bangkok

            VehicleTypeCode:
              type: string
              nullable: true
              description: รหัสประเภทรถ
              example: PICKUP

            VehicleTypeName:
              type: string
              nullable: true
              description: ชื่อประเภทรถ
              example: Pickup truck

            Status:
              type: string
              enum:
                - unload_now
                - waiting_unload
              description: สถานะปัจจุบันของข้อมูลนี้
              example: unload_now
          description: ข้อมูล Business Ticket

        Market:
          type: object
          required:
            - MarketCode
            - MarketName
            - DropoffPoint
          properties:
            MarketCode:
              type: string
              description: รหัสตลาด
              example: "1123"

            MarketName:
              type: string
              description: ชื่อตลาด
              example: Market A

            DropoffPoint:
              type: string
              nullable: true
              example: "Gate 1 - Zone A"
              description: ส่งค่ากลับตามที่ส่งมาตอนสร้าง Ticket นี้
          description: ข้อมูลตลาด

        Booths:
          type: array
          items:
            $ref: "#/components/schemas/GateTicketResponseBooth"
          description: รายการแผงค้า

        WorkerCount:
          type: integer
          example: 5
          description: จำนวน Worker ที่ Business Ticket นี้ต้องการ ใช้สำหรับ dispatch คือค่ามากที่สุด (MAX WorkerCount) ในบรรดาสินค้าทุกชิ้นของทุกแผงใน Ticket นี้ ไม่ใช่ผลรวม

        Qr:
          type: object
          required:
            - DriverQrToken
            - DriverQrUrl
          properties:
            DriverQrToken:
              type: string
              example: driver-qr-1
              description: ใช้ร่วมกันทั้งคันรถ (TicketNumber) Worker เช็คอินด้วย TicketNo ของแต่ละ Business Ticket แยกต่างหาก (บาร์โค้ดที่พิมพ์บนตั๋วกระดาษของด่าน) แทน ดู POST /api/workers/me/assignments/check-in-barcode
            DriverQrUrl:
              type: string
              example: "https://driver.example.com/track#token=driver-qr-1"
              description: URL หน้า Driver Web ที่ Gate/ระบบพิมพ์ตั๋วต้อง encode เป็นภาพ QR แทนการ encode DriverQrToken ดิบ — token อยู่ใน URL fragment (หลัง #) เท่านั้น เพื่อไม่ให้ถูกส่งใน HTTP request/access log/Referer ตอน browser โหลดหน้า /track ประกอบจาก config DRIVER_WEB_BASE_URL
          description: ข้อมูล QR สำหรับคนขับเปิดหน้า Driver Web (DriverQrUrl) หรือให้ Driver Web เดิมแลก session เอง (DriverQrToken ผ่าน POST /api/driver/qr-sessions)

    DriverSessionResponse:
