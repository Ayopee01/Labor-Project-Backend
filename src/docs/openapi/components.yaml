    GateTicketRequest:
      type: object
      required:
        - TicketNumber
        - TicketNo
        - TicketCreatedAt
        - BoothCount
        - MarketCode
        - DropoffPoint
        - LicensePlate
        - LicensePlateProvince
        - VehicleTypeCode
        - VehicleTypeName
        - Booths
        - Dispatch
      properties:
        TicketNumber:
          type: string
          pattern: "^\\d{14}$"
          example: "20260804000001"
          description: เลขอ้างอิงระดับรถ ต้องเป็นตัวเลขล้วน 14 หลักเท่านั้น ห้ามมีตัวอักษรหรืออักขระพิเศษ ส่งซ้ำได้หลายครั้งด้วย TicketNo ใหม่ทุกครั้ง เมื่อรถคันเดิมสร้าง Business Ticket เพิ่มขึ้นเรื่อยๆ (1 request ของ Gate ต่อ 1 Business Ticket และทุก request สังกัดตลาดเดียวเท่านั้น) VehicleJob เดิมจะถูกใช้ซ้ำ ไม่มีการสร้างงานรถซ้ำ

        TicketNo:
          type: string
          pattern: "^\\d{14}$"
          example: "20260804000002"
          description: เลขอ้างอิง Business Ticket ผูกกับตลาดเดียว ต้องเป็นตัวเลขล้วน 14 หลักเท่านั้น ห้ามมีตัวอักษรหรืออักขระพิเศษ 1 request = 1 ตลาด (ทุกแผงใน request นี้ต้องสังกัด MarketCode เดียวกัน) = จำนวนแผงเท่ากับ BoothCount ของ request นี้ ถ้าส่ง TicketNo เดิมซ้ำภายใต้ TicketNumber และ MarketCode เดิม ระบบจะเพิ่มแผง/สินค้าใหม่เข้า Business Ticket เดิมแทนการสร้างใหม่ แต่ถ้า TicketNo เดิมถูกส่งมาพร้อม MarketCode ต่างไป จะถูกปฏิเสธด้วย GATE_TICKET_ALREADY_EXISTS เสมอ ถ้า Admin ยกเลิก Ticket ไปแล้ว TicketNo นั้นจะว่างอีกครั้งและนำมาใช้สร้าง Business Ticket ใหม่ได้ (สังกัด MarketCode ใดก็ได้)

        TicketCreatedAt:
          type: string
          format: date-time
          description: เวลาที่ Gate สร้าง Ticket นี้
          example: "2026-08-04T14:30:00+07:00"

        BoothCount:
          type: integer
          minimum: 1
          example: 2
          description: ต้องเท่ากับจำนวนรายการใน Booths ทุกแผงใน request นี้สังกัด MarketCode เดียวกัน

        MarketCode:
          type: string
          description: รหัสตลาด
          example: "1123"

        DropoffPoint:
          type: string
          example: "Gate 1 - Zone A"
          description: จุดที่สินค้าของ Ticket นี้ถูกขนลง จำเป็นต้องส่งทุก request คู่กับ MarketCode Ticket อื่นของ MarketCode เดียวกันส่ง DropoffPoint ซ้ำกันได้อิสระ (ไม่บังคับให้ไม่ซ้ำ) บันทึกแยกตาม Ticket และคืนค่ากลับใน Market.DropoffPoint

        LicensePlate:
          type: string
          description: ทะเบียนรถ
          example: ABC-1234

        LicensePlateProvince:
          type: string
          description: จังหวัดของป้ายทะเบียน
          example: Bangkok

        VehicleTypeCode:
          type: string
          description: รหัสประเภทรถ
          example: PICKUP

        VehicleTypeName:
          type: string
          description: ชื่อประเภทรถ
          example: Pickup truck

        Booths:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/GateTicketBoothRequest"
          description: รายการแผงค้า

        Dispatch:
          type: boolean
          description: false คือส่งงานรถกลับไปสถานะรอและดันทีมกลับไปหน้าคิว FIFO ส่วน true คือ dispatch อีกครั้งทันที
          example: true
