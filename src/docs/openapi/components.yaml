components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    gateBasicAuth:
      type: http
      scheme: basic
      description: ข้อมูลรับรองตัวตนของ Gate Client โดย Username คือ client_id และ Password คือ client_secret
  parameters:
    RequestIdHeader:
      in: header
      name: X-Request-Id
      required: false
      schema:
        type: string
      description: Correlation ID สำหรับ request นี้ (ไม่บังคับ) ถ้าไม่ส่งมา server จะสร้างให้เอง โดยจะส่งค่ากลับใน response header ชื่อ X-Request-Id และใน error response body ทุกครั้ง — แนะนำให้ส่งค่าของตัวเอง (หรือใช้ค่าจาก response ก่อนหน้าซ้ำ) เพื่อให้ค้นหา log บรรทัดที่ตรงกันได้ง่ายขึ้นเวลาแจ้งปัญหา
    ClientTypeHeader:
      in: header
      name: X-Client-Type
      required: false
      schema:
        type: string
        enum:
          - worker_app
          - admin_webapp
          - driver_webapp
          - gate
          - line_oa
      description: ตัวระบุประเภท client (ไม่บังคับ) ใช้เป็นค่าสำรองสำหรับบันทึก log เฉพาะกรณีที่ server ตรวจไม่ได้ว่า client เป็นประเภทใดจาก path ของ request หรือ role ของบัญชีที่ login อยู่ (เช่น route ที่ใช้ร่วมกันและยังไม่ได้ authenticate อย่าง /api/auth/login) ไม่จำเป็นต้องส่งใน route ที่ path หรือ role สามารถระบุประเภท client ได้อยู่แล้ว
    ClientVersionHeader:
      in: header
      name: X-Client-Version
      required: false
      schema:
        type: string
      description: เวอร์ชันของ client app ที่เรียกใช้งาน (ไม่บังคับ) จะถูกบันทึกไว้ใน server log เพื่อใช้ช่วย debug
    DriverDeviceIdHeader:
      in: header
      name: X-Driver-Device-Id
      required: true
      schema:
        type: string
        format: uuid
      description: >-
        UUID ของเครื่องที่ Driver Web สุ่มสร้างครั้งแรกและเก็บถาวรใน browser storage ต้องเป็นค่าเดียวกับ DeviceId
        ที่ใช้ตอนสร้าง session (POST /api/driver/qr-sessions) บังคับส่งทุก request ถ้าไม่ส่งจะได้ 401
        MISSING_DRIVER_DEVICE_ID และถ้าไม่ตรงกับ session จะได้ 401 DRIVER_DEVICE_MISMATCH
  headers:
    ShouldRefreshHeader:
      description: >-
        แนบมาเมื่อ AccessToken ที่ใช้เรียก endpoint นี้เหลือเวลาน้อยกว่า ACCESS_TOKEN_REFRESH_THRESHOLD (default 2
        นาที) ก่อนหมดอายุ เป็นสัญญาณเตือนเฉยๆ ให้ Client เรียก POST /api/auth/refresh ทันที — Server ไม่ได้ออก
        AccessToken ใหม่ยัดมาให้ตรงๆ ใน header นี้ ต้องแลกผ่าน RefreshToken จริงเสมอเพื่อความปลอดภัย แนบมาทุก
        endpoint ที่ต้องยืนยันตัวตนแบบ Bearer Token (ไม่ใช่แค่ Group Auth) — ดูรายละเอียดที่ POST /api/auth/refresh
      schema:
        type: string
        enum:
          - "true"
  schemas:
    ErrorResponse:
      type: object
      required:
        - statusCode
        - code
        - message
      properties:
        statusCode:
          type: integer
          description: รหัสสถานะ HTTP
          example: 401
        code:
          type: string
          description: รหัสผลลัพธ์
          example: INVALID_TOKEN
        message:
          type: string
          description: ข้อความผลลัพธ์
          example: Invalid or expired token.
        request_id:
          type: string
          nullable: true
          description: รหัสอ้างอิงคำขอนี้ (correlation id) จะถูก echo กลับมาใน response header ชื่อ X-Request-Id ด้วย — แนบมาด้วยเวลาแจ้งปัญหา เพื่อให้ทีมหา log บรรทัดที่ตรงกันได้ง่ายขึ้น
          example: 3fa4c1e2-9b7a-4e2f-8a5a-6f1a2b9c3d4e
        shift:
          type: object
          nullable: true
          description: มีค่าเฉพาะตอน error เป็น OUTSIDE_WORK_SHIFT
          properties:
            name:
              type: string
              description: ชื่อ
              example: Morning
            start_time:
              type: string
              description: เวลาเริ่มกะ (HH:mm)
              example: "06:00"
            end_time:
              type: string
              description: เวลาสิ้นสุดกะ (HH:mm)
              example: "18:00"
        remaining_time:
          type: string
          nullable: true
          description: ข้อความเวลาที่เหลือก่อนกะถัดไปแบบอ่านง่าย มีค่าเฉพาะตอน error เป็น OUTSIDE_WORK_SHIFT
          example: 28 minutes
    ReadinessCheck:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - error
          description: ผลตรวจ dependency นี้
          example: ok
    ReadinessResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
          description: ready เมื่อ database และ redis พร้อมทั้งคู่ ไม่งั้นเป็น not_ready
          example: ready
        checks:
          type: object
          description: ผลตรวจแยกตาม dependency
          properties:
            database:
              $ref: "#/components/schemas/ReadinessCheck"
            redis:
              $ref: "#/components/schemas/ReadinessCheck"
        timestamp:
          type: string
          format: date-time
          description: เวลาที่ตรวจ (ISO 8601)
          example: 2026-07-22T09:00:00.000Z
    Account:
      type: object
