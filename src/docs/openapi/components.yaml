    DriverVehicleJob:
      type: object
      description: ข้อมูลงานรถแบบย่อที่ Driver เห็นตอนสร้าง session (ไม่มี field ระดับ Admin) — ใช้ตอบเฉพาะ POST /api/driver/qr-sessions เท่านั้น ส่วน GET /jobs/current และ POST .../ready ใช้ DriverJobVehicle (ข้อมูลครบกว่า)
      properties:
        ticket_number:
          type: string
          description: เลขอ้างอิงระดับรถ (TicketNumber) 14 หลัก ที่ Gate ออกให้ทั้งคัน
          example: TRUCK-20260723-001
        license_plate:
          type: string
          description: ทะเบียนรถ
          example: ABC-1234
        license_plate_province:
          type: string
          nullable: true
          description: จังหวัดของป้ายทะเบียน
          example: Bangkok
        vehicle_type:
          type: string
          nullable: true
          description: ประเภทรถ
        workers_required:
          type: integer
          description: จำนวน Worker ที่ต้องการสำหรับงานรถนี้
        status:
          type: string
          description: สถานะปัจจุบันของงานรถ
          example: WAIT
        created_at:
          type: string
          format: date-time
          description: เวลาที่สร้างข้อมูลนี้
        updated_at:
          type: string
          format: date-time
          description: เวลาที่แก้ไขข้อมูลนี้ล่าสุด
    DriverOperationStatus:
      type: string
      enum:
        - WAIT
        - DISPATCH_NOW
        - WAITING_FOR_WORKER
        - IN_PROGRESS
        - COMPLETED
        - CANCELLED
      description: >-
        สถานะระดับ UI ที่ Backend คำนวณให้เป็น canonical (Frontend ห้าม derive จาก vehicle_job.status เอง)
        — WAIT = ยังไม่ dispatch (dispatch_now=false), DISPATCH_NOW = dispatch แล้วแต่ทีมยังไม่ครบ/ยังไม่เริ่ม
        ทำงานจริง, WAITING_FOR_WORKER = dispatch แล้วแต่ worker active ยังไม่ครบจำนวนที่ต้องการ, IN_PROGRESS =
        กำลังทำงานอยู่จริง (รวมถึงกรณี vehicle_job.status เป็น RELEASED และกรณี booth ถูก REJECT ที่ยังไม่นับเป็น
        สถานะ UI ใหม่), COMPLETED/CANCELLED = งานจบแล้ว
      example: IN_PROGRESS
    DriverJobProduct:
