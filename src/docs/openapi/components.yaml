          type: string
          nullable: true
          description: รหัสภายในของผู้ทำรายการ (Account id สำหรับ admin/worker, LINE user id สำหรับ vendor) เป็น null ถ้าแหล่งข้อมูลไม่มีตัวตนผู้ทำรายการ (system/gate/driver)
          example: "15"
        vehicle_job_id:
          type: string
          nullable: true
          description: รหัสภายในของงานรถที่ข้อมูลนี้สังกัด
          example: "120"
        market_job_id:
          type: string
          nullable: true
          description: รหัสภายในของ MarketJob (Business Ticket) ที่ข้อมูลนี้สังกัด
        ticket_id:
          type: string
          nullable: true
          description: รหัสภายในของ BoothJob (แผง) ที่ข้อมูลนี้สังกัด
        assignment_id:
          type: string
          nullable: true
          description: รหัส assignment
          example: "455"
        worker_id:
          type: string
          nullable: true
          description: รหัส Account ภายในของ Worker ที่เกี่ยวข้อง มีค่าเฉพาะเหตุการณ์ที่เกี่ยวกับ Worker คนเดียว เป็น null สำหรับเหตุการณ์ที่มีหลาย Worker (ดู worker_account_ids/worker_codes ใน metadata แทน)
        reason_code:
          type: string
          nullable: true
          description: รหัสเหตุผล คู่กับ reason_text
        reason_text:
          type: string
          nullable: true
          description: ข้อความเหตุผล คู่กับ reason_code
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: ข้อมูลบริบทรูปแบบอิสระ รวมถึงรหัสทางธุรกิจสำหรับค้นหา/แสดงผล เช่น ticketNumber (VehicleJob), ticketNo/marketCode/marketName (MarketJob), boothCode/boothName (BoothJob ในเหตุการณ์ส่งยอด/ให้คะแนน ที่ actor_type อาจเป็น vendor), workerCode (Account.username ของ Worker ที่เกี่ยวข้อง), และ actorCode/actorName (Account.username/full_name ของ Admin ที่ทำรายการ เมื่อ actor_type เป็น admin) ฝั่ง Frontend ใช้ค่าเหล่านี้สร้างข้อความอ้างอิงทางธุรกิจที่อ่านง่ายแทนการแสดง id ภายใน สำหรับ vendor ให้ใช้ boothName กับ boothCode แทน LINE user id ใน actor_id สำหรับเหตุการณ์ SecurityAuditLog (27.12 ต้องมีสิทธิ์ audit:read ดูคำอธิบาย endpoint) จะมีเพิ่มเติม outcome (success/failure), sessionId, ipAddress, userAgent, failureCode (unknown_username/invalid_password/account_inactive เฉพาะ auth_login_failed), attemptedUsername (username ดิบที่พิมพ์ตอน login เฉพาะตอนระบุตัวตนไม่ได้ว่าเป็น admin หรือ worker คนไหน ไม่ปนกับ actorCode/workerCode ของผู้ทำรายการที่ระบุตัวตนได้แล้ว) และในเหตุการณ์แก้ไข account/settings/gate-client/mobile-version จะมี targetType/targetAccountId/targetWorkerId/targetClientId/targetVersionId ระบุว่าแก้ไขอะไร auth_session_revoked (27.14.1 บันทึกใน transaction เดียวกับ auth_force_login) จะมี revoke_source ("force_login") และ new_session_id อ้างอิง session ที่ auth_force_login เดียวกันนั้นสร้างขึ้น ให้ไล่คู่กันผ่าน requestId ที่ใช้ร่วมกันแทน ไม่เคยมีรหัสผ่าน, token เต็ม, session secret หรือ gate client secret/hash
          example:
            minutes: 15
            assignment_ids: [455]
            ticketNumber: "20261234567890"
            marketCode: "MKT-001"
            marketName: "ตลาดไท"
            boothName: "ร้านผักสด A"
            boothCode: "GV3/98"
            actorCode: "admin01"
            actorName: "สมชาย ใจดี"
        before:
          type: object
          additionalProperties: true
          description: "สถานะของ field ที่เปลี่ยนแปลง ณ ตอนก่อนเหตุการณ์นี้เกิดขึ้นจริง ไม่เคยคำนวณย้อนหลังจากสถานะปัจจุบันหรือ updated_at มีค่าเฉพาะตอนแหล่งข้อมูลบันทึกค่าก่อนหน้าไว้จริง ไม่มี field นี้เลย (ไม่ใช่ null) สำหรับเหตุการณ์ที่ไม่ track before/after และไม่มีในครั้งที่ไม่มีค่าก่อนหน้าให้บันทึก (เช่น การเปลี่ยนสถานะบังคับครั้งแรกของ Worker ที่ไม่มีสถานะคิวก่อนหน้า หรือเหตุการณ์ *_created ที่ไม่มีอะไรมาก่อน) มีค่าสำหรับ worker_force_status_changed ({ \"status\": \"...\" }) และเฉพาะเหตุการณ์แก้ไขของ Security Audit ประเภท *_updated เท่านั้น (เฉพาะ field ที่เปลี่ยนจริง) ได้แก่ system_settings_updated, gate_client_updated, admin_account_updated, admin_permissions_changed, admin_status_changed, worker_account_updated, admin_profile_updated และ mobile_app_version_updated"
          example:
            status: ready
        after:
          type: object
          additionalProperties: true
          description: สถานะของ field ที่เปลี่ยนแปลง ณ ตอนหลังเหตุการณ์นี้สำเร็จ กฎการมี/ไม่มีค่าเหมือน before บวกเหตุการณ์สร้างของ Security Audit ประเภท *_created (gate_client_created, admin_account_created, worker_account_created, mobile_app_version_created) ที่มี after แต่ไม่มี before เพราะยังไม่มีอะไรอยู่ก่อนสร้าง
          example:
            status: open_app
        occurred_at:
          type: string
          format: date-time
          description: เวลาที่เกิดเหตุการณ์นี้
    AdminAuditEventsSummary:
